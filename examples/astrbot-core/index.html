bot/core/agent/message.py",195,248]]}},{"id":"ToolCall","label":"ToolCall","kind":"record","group":"output","x":2170,"y":820,"summary":"LLM 请求工具的结构，包含 id、function.name 和 JSON arguments。","file":"astrbot/core/agent/message.py","fields":["id","function.name","function.arguments"],"methods":["model_dump()"],"sources":[["astrbot/core/agent/message.py",144,178]],"explanation":{"role":"描述模型提出的一次工具调用，保存调用标识和函数名、参数，供工具执行及其回复关联使用。","logic":["FunctionBody 保存工具 name 和 arguments；ToolCall 自身携带 id、type 与 function。","自定义序列化对额外内容进行整理，以适配消息输出。"],"data":["function.arguments 是工具参数字符串；要真正执行工具，后续执行链还需要解析参数、查找工具并调用。","id 与工具回复中的 tool_call_id 用于关联请求和结果。"],"caveats":["ToolCall 是调用意图的数据表示，本身不执行工具，也不直接代表 MCP 协议对象。"],"sources":[["astrbot/core/agent/message.py",144,177],["astrbot/core/agent/message.py",195,212]]}},{"id":"MessageChain","label":"MessageChain","kind":"class","group":"output","x":2170,"y":1000,"summary":"平台无关的输出组件链；AgentResponse、插件结果和事件结果都用它承载文本/图片/引用等。","file":"astrbot/core/message/message_event_result.py","fields":["chain","type","use_t2i_","use_markdown_"],"methods":["derive()","message()","get_plain_text()","squash_plain()"],"sources":[["astrbot/core/message/message_event_result.py",18,193]],"explanation":{"role":"平台无关的一条输出消息，按顺序容纳 Plain、Image、At 等消息组件及发送格式选项。","logic":["message、at、url_image 等方法向 chain 添加组件并返回自身，便于连续构造。","derive 使用给定组件构造新 MessageChain，并继承 use_t2i_、use_markdown_、type；默认新链为空。","get_plain_text 提取 Plain 文本；squash_plain 将所有 Plain 文本合并到第一个 Plain 组件，并保留非文本组件。"],"data":["chain 是有顺序的 BaseMessageComponent 列表；type 用于标注部分业务场景；use_t2i_/use_markdown_ 控制发送方式。"],"caveats":["MessageChain 本身不包含事件是否停止等结果控制语义；MessageEventResult 继承它并增加这些信息。","derive 不会复制原组件列表，只有显式传入链时新链才包含那些组件。"],"sources":[["astrbot/core/message/message_event_result.py",18,58],["astrbot/core/message/message_event_result.py",149,192]]}},{"id":"MessageEventResult","label":"MessageEventResult","kind":"class","group":"output","x":2170,"y":1180,"summary":"事件级结果包装，继承 MessageChain，增加 result_type/content_type/streaming 等投递元数据。","file":"astrbot/core/message/message_event_result.py","fields":["chain：继承的消息组件列表","result_type：事件是否停止","result_content_type：普通/LLM/流式结果","async_stream：流式结果生成器"],"methods":["set_async_stream()：设置流式结果","is_llm_result()/is_model_result()：判断结果来源","stop_event()/continue_event()：设置传播状态"],"sources":[["astrbot/core/message/message_event_result.py",195,288]],"explanation":{"role":"事件处理阶段的结果对象：在 MessageChain 组件列表之外保存事件传播状态、结果来源和流式生成器。","logic":["结果可由 event.set_result 暂存，再由 ResultDecorateStage 处理，最后由 RespondStage 读取。","stop_event 和 continue_event 修改传播状态；set_result_content_type 标明一般、LLM 或流式等结果类型；set_async_stream 附加异步流。","is_model_result 包含 LLM_RESULT 与 AGENT_RUNNER_ERROR，而 is_llm_result 只匹配前者。"],"data":["result_type 是 EventResultType；result_content_type 是 ResultContentType；async_stream 仅在流式路径使用。"],"caveats":["停止事件传播与停止 Agent 的运行是不同的控制概念。","继承 MessageChain 不表示这个对象已经由平台发送。"],"sources":[["astrbot/core/message/message_event_result.py",195,288],["astrbot/core/astr_agent_run_util.py",275,297],["astrbot/core/pipeline/respond/stage.py",194,210]]}},{"id":"ResultDecorateStage","label":"ResultDecorateStage","kind":"class","group":"output","x":2170,"y":1360,"summary":"读取 event.result，执行结果装饰钩子、前缀、分段、安全检查、TTS/T2I 等后处理，再写回 event.result。","file":"astrbot/core/pipeline/result_decorate/stage.py","fields":["ctx"],"methods":["process(event)"],"sources":[["astrbot/core/pipeline/result_decorate/stage.py",22,150]],"explanation":{"role":"Pipeline 中的结果装饰阶段，在实际发送前对事件结果执行钩子、内容检查与可选格式处理。","logic":["process 先取 event.get_result；结果不存在、组件为空或类型为 STREAMING_RESULT 时提前返回。","符合条件时先检查 LLM 回复内容，再执行 OnDecoratingResultEvent 插件钩子；插件可以替换或清除结果，因此后续重新读取。","非流式完成路径按配置处理回复前缀、文本分段、推理内容或 TTS 等，调整同一结果的 chain。"],"data":["输入与输出均围绕事件中的 MessageEventResult；Plain 文本可能被拆分或转成语音组件。"],"caveats":["流式结果与 STREAMING_FINISH 的处理不同；不能认为每个流式片段都经过普通文本分段或安全检查。","实际发送由后续 RespondStage 和具体平台事件实现完成。"],"sources":[["astrbot/core/pipeline/result_decorate/stage.py",126,205],["astrbot/core/pipeline/result_decorate/stage.py",209,277],["astrbot/core/pipeline/result_decorate/stage.py",317,343]]}},{"id":"RespondStage","importance":"key","label":"RespondStage","kind":"class","group":"output","x":2170,"y":1540,"summary":"按结果类型和平台能力选择 send 或 send_streaming，发送后触发 OnAfterMessageSentEvent 并清理结果。","file":"astrbot/core/pipeline/respond/stage.py","fields":["ctx/config：profile 与发送配置"],"methods":["process(event)：读取结果并选择 send 或 send_streaming；具体发送由事件子类执行"],"sources":[["astrbot/core/pipeline/respond/stage.py",44,80],["astrbot/core/pipeline/respond/stage.py",194,211],["astrbot/core/pipeline/respond/stage.py",297,398]],"explanation":{"role":"Pipeline 的发送阶段，将事件已有结果按普通或流式路径交给对应平台事件发送。","logic":["先读取 event.get_result；空结果、已结束的流式状态、无有效内容，以及与主动发送工具重复的文本等条件会提前返回。","STREAMING_RESULT 要求 async_stream，随后调用 event.send_streaming；普通结果则检查组件、根据配置分段并调用 event.send。","普通发送完成后触发 OnAfterMessageSentEvent；未被钩子提前终止时清除事件结果。"],"data":["输入为 MessageEventResult；普通分段时使用 derive 创建携带原发送选项的 MessageChain。","流式路径使用 MessageChain 片段的异步流；具体平台消息转换发生在事件的具体实现中。"],"caveats":["发送不总是一次完成：Record 或分段回复可能产生多次 event.send。","流式分支调用 send_streaming 后直接返回，不应笼统描述为所有路径都会执行末尾的发送后钩子与清理。"],"sources":[["astrbot/core/pipeline/respond/stage.py",194,245],["astrbot/core/pipeline/respond/stage.py",290,305],["astrbot/core/pipeline/respond/stage.py",337,409]]}},{"id":"BaseDatabase","importance":"key","label":"BaseDatabase","kind":"abstract","group":"output","x":2170,"y":1720,"summary":"数据库抽象边界，提供 Conversation、消息历史、附件、Provider 统计等持久化接口。","file":"astrbot/core/db/__init__.py","fields":["engine","AsyncSessionLocal"],"methods":["initialize()","get_db()","get_conversations()","create_conversation()","insert_platform_message_history()","get_platform_message_history()"],"sources":[["astrbot/core/db/__init__.py",35,110],["astrbot/core/db/__init__.py",129,298]],"explanation":{"role":"数据库服务抽象契约，供会话、配置、定时任务等管理组件依赖，避免调用方直接绑定具体数据库实现。","logic":["抽象接口定义初始化、对话和其他持久化操作；运行时由 SQLiteDatabase 等具体实现提供行为。"],"data":["接口的输入输出取决于具体操作，如对话 ID、查询条件与 ConversationV2 记录。"],"caveats":["抽象类不应被误读成独立存储服务；具体持久化、SQL 和实际文件由实现类决定。"],"sources":[["astrbot/core/db/__init__.py",35,110],["astrbot/core/db/sqlite.py",77,91]]}},{"id":"ContentComponent","label":"BaseMessageComponent","kind":"abstract","group":"output","x":2170,"y":1900,"summary":"BaseMessageComponent 抽象消息组件类，定义组件类型和基础序列化；Plain、Image、At、Reply 等类继承它。","file":"astrbot/core/message/components.py","fields":["type"],"methods":["to_dict()","toDict()"],"sources":[["astrbot/core/message/components.py",46,127],["astrbot/core/message/components.py",501,590],["astrbot/core/message/components.py",770,904]],"explanation":{"role":"图中的 ContentComponent 表示源码里的 BaseMessageComponent 及其具体消息组件，服务于平台消息的收发。","logic":["基础类提供组件类型和序列化接口；Plain、Image、At、Reply 等具体类型分别承载各自内容。","平台适配器依据组件类型和数据转换为对应平台的消息格式。"],"data":["MessageChain.chain 保存组件实例，组件有顺序，类型决定平台适配器如何处理。"],"caveats":["ContentComponent 是图节点名称，源码基类名是 BaseMessageComponent。","这里的组件不同于模型上下文中的 ContentPart。"],"sources":[["astrbot/core/message/components.py",46,127],["astrbot/core/message/message_event_result.py",18,34]]}},{"id":"CronJobPayload","label":"Cron 运行数据（概念）","kind":"concept","group":"cron","x":2870,"y":100,"summary":"概念分组：CronJob 的 payload、会话与提示词，不是源码中的独立类。","file":"astrbot/core/cron/manager.py","fields":[],"methods":[],"sources":[["astrbot/core/cron/manager.py",437,510]],"explanation":{"role":"图中将定时任务负载及其衍生上下文归为一组，帮助追踪 Agent 如何在没有外部平台入站消息时被唤醒。","logic":["_run_active_agent_job 从 CronJob.payload 读取 session；有投递会话时使用该会话，否则构造平台为 cron、类型为 OTHER_MESSAGE、会话 ID 为 job_id 的 MessageSession。","note 依次回退到任务 description、name；代码把任务元数据放在 extras.cron_job，把原始 payload 放在 extras.cron_payload，然后调用 _woke_main_agent。","_woke_main_agent 创建 CronMessageEvent，按其统一消息来源获取配置，再组装主 Agent。"],"data":["payload 是字典而非独立源码类；extras 同时承载抽出的 cron_job 信息和原始 cron_payload。","delivery_session_str 与实际运行时 session_str 要区分：前者可以为空，而后者会有 cron 虚拟会话回退值。"],"caveats":["该节点是说明用概念分组，源码中没有名为 CronJobPayload 的独立类。","构造 CronMessageEvent 不意味着收到了一条真实的平台入站消息。"],"sources":[["astrbot/core/cron/manager.py",437,471],["astrbot/core/cron/manager.py",473,529],["astrbot/core/cron/manager.py",580,604]]}},{"id":"SendMessageToUserTool","label":"SendMessageToUserTool","kind":"class","group":"cron","x":2870,"y":300,"summary":"Cron/Agent 可用的持久会话发送工具；最终调用 Context.send_message → Platform.send_by_session。","file":"astrbot/core/tools/message_tools.py","fields":["name","description","parameters"],"methods":["call()"],"sources":[["astrbot/core/tools/message_tools.py",76,190]],"explanation":{"role":"供 Agent 主动向指定会话发送消息的内置工具，既可用于定时任务，也可用于其他 Agent 场景。","logic":["call 从运行上下文取得当前会话；目标会话不同时先检查管理员权限。","验证 messages 列表，将 plain、image、record、video、file、mention_user 等输入转换成实际消息组件，必要时解析沙箱文件。","解析目标 MessageSession；对不含冒号的裸 session ID 可尝试补当前会话的平台和消息类型；然后包装 MessageChain 并调用 Context.send_message。","向当前会话成功发送时记录已发文本，供 RespondStage 避免重复回复。"],"data":["输入 messages 为字典数组，输出是工具执行结果字符串；副作用是调用平台发送消息。"],"caveats":["跨会话权限检查先于发送；并非任何用户均可向任意目标主动发消息。","旧图引用到类定义但未覆盖 call 的实际实现，应包含 message_tools.py 第 209 行以后的源码。"],"sources":[["astrbot/core/tools/message_tools.py",76,132],["astrbot/core/tools/message_tools.py",209,260],["astrbot/core/tools/message_tools.py",302,363],["astrbot/core/star/context.py",665,696]]}},{"id":"AiocqhttpMessageEvent","label":"AiocqhttpMessageEvent","kind":"class","group":"platform","x":420,"y":1990,"summary":"OneBot 的具体事件实现：覆写发送方法，将统一消息组件转成 OneBot 消息段并调用 CQHttp。是平台事件实现的一个例子。","file":"astrbot/core/platform/sources/aiocqhttp/aiocqhttp_message_event.py","fields":["bot"],"methods":["send()","send_streaming()","send_message()"],"sources":[["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_message_event.py",23,35],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_message_event.py",127,220]],"explanation":{"role":"OneBot 适配器使用的 AstrMessageEvent 子类，在统一事件接口之外持有 CQHttp 客户端并实现协议侧发送。","logic":["由 AiocqhttpAdapter.create_event() 构造，继承统一事件状态并保存 bot。","send() 从原始消息获取 event，判断群聊或私聊及目标 ID，调用 send_message()。","send_message() 将 MessageChain 转为 OneBot 消息段；_dispatch_send() 优先按数字目标调用群聊或私聊 API，否则使用可用的原始 Event 回退。"],"data":["输入为内部 MessageChain，输出为 OneBot 消息段列表和 CQHttp 发送调用；send() 完成后还调用基类 send()。"],"caveats":["如果既没有有效数字目标，也没有可用于回退的原始 Event，_dispatch_send 会抛出 ValueError。"],"sources":[["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_message_event.py",23,33],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_message_event.py",91,153],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_message_event.py",184,198],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",492,510]]}},{"id":"WebChatMessageEvent","label":"WebChatMessageEvent","kind":"class","group":"platform","x":420,"y":2170,"summary":"WebChat 的具体事件实现：将 MessageChain 的组件编码后写入回复队列。它只是平台事件的一种实现。","file":"astrbot/core/platform/sources/webchat/webchat_event.py","fields":[],"methods":["_send()","send()","send_streaming()"],"sources":[["astrbot/core/platform/sources/webchat/webchat_event.py",23,70],["astrbot/core/platform/sources/webchat/webchat_event.py",165,220]],"explanation":{"role":"WebChat 对应的 AstrMessageEvent 子类，负责将内部回复转换为 WebChat 请求可读取的输出帧。","logic":["send() 取得 message_obj.message_id，调用 _send() 将消息写回 WebChatQueueMgr，然后调用基类 send()。","_send() 按 MessageChain 中的组件写入对应类型的输出帧；没有消息时写入 type=end 的结束帧。","send_streaming() 处理流式结果，send_typing() 可发送 run_started 信号。"],"data":["MessageChain 中的组件会转为带 type、data、streaming、message_id 等字段的输出字典，按 request_id 写入回传队列。"],"caveats":["PipelineScheduler 对 WebChat 事件调用 send(None) 是结束信号，并不意味着发送文字 'None'。"],"sources":[["astrbot/core/platform/sources/webchat/webchat_event.py",23,64],["astrbot/core/platform/sources/webchat/webchat_event.py",151,199],["astrbot/core/pipeline/scheduler.py",91,100]]}},{"id":"build_main_agent","importance":"key","label":"build_main_agent()","kind":"function","group":"agent","x":1120,"y":1100,"summary":"顶层异步构建函数：选择 Provider、准备 ProviderRequest 与工具、创建运行上下文和 Runner，并返回构建结果。不是类方法。","file":"astrbot/core/astr_main_agent.py","fields":["event：当前事件","plugin_context：插件 Context","config：MainAgentBuildConfig","provider/req：可选预选模型及预制请求"],"methods":["_select_provider()：选择 Provider","collect_initial_request()：把事件和媒体整理成 ProviderRequest","组装知识库、工具与上下文后创建 Runner 并调用 reset()"],"sources":[["astrbot/core/astr_main_agent.py",1734,1780],["astrbot/core/astr_main_agent.py",1880,1910],["astrbot/core/astr_main_agent.py",1998,2040]],"explanation":{"role":"为当前消息准备主 Agent 的请求、依赖和运行器。它是异步构建函数，不是实际反复向模型发请求的循环；真正运行由返回结果中的 agent_runner 负责。","logic":["优先使用传入的 provider，否则通过 _select_provider 根据事件和插件上下文选择；找不到可用 Provider 时向事件写入错误信息并返回 None。","没有预制请求，或现有请求尚未包含引用消息而事件包含引用消息时，调用 collect_initial_request()，从事件、会话和媒体信息准备 ProviderRequest；收集失败时返回 None。","准备图片并去重媒体引用，可按配置提取文件、处理引用消息、应用插件请求装饰和知识库内容；请求既没有文本、图片、音频也没有附件时直接返回 None。","填充 session_id，处理插件工具、搜索工具、安全模式和运行环境工具。创建 AstrAgentContext(context=plugin_context, event=event)，按条件补充定时任务、主动发送等内置工具。","构造 AgentRunner，调用 reset() 并传入 ProviderRequest、AgentContextWrapper、FunctionToolExecutor、hooks、流式和上下文压缩等配置，最后返回 MainAgentBuildResult。"],"data":["输入：AstrMessageEvent、插件服务 Context、MainAgentBuildConfig，以及可选的 Provider、ProviderRequest 和图片处理缓存。","结果：成功时为 MainAgentBuildResult，包含 agent_runner、provider_request 和 provider；不满足执行条件时为 None。构建过程会修改或补充传入的请求对象。","AgentContextWrapper 包含 AstrAgentContext，后者再同时持有插件 Context 和当前 event；工具执行器通过这一层取得事件及服务。"],"caveats":["apply_reset=False 时不会等待 reset 协程；结果的 reset_coro 需要由调用方随后处理，不能误以为 runner 已完成初始化。","ProviderRequest 是准备好的模型请求，不等于最终网络协议请求；模型调用和具体厂商格式转换仍由 Runner 与 Provider 协作完成。"],"sources":[["astrbot/core/astr_main_agent.py",1734,1783],["astrbot/core/astr_main_agent.py",1825,1840],["astrbot/core/astr_main_agent.py",1877,1896],["astrbot/core/astr_main_agent.py",1911,1935],["astrbot/core/astr_main_agent.py",2002,2042]]}},{"id":"_PermissionGuardedTool","label":"_PermissionGuardedTool","kind":"class","group":"cron","x":2870,"y":700,"summary":"FunctionToolManager 为非内置工具创建的权限包装。call() 检查权限后委托原工具；包装后的 MCPTool 先走执行器本地工具分支。","file":"astrbot/core/provider/func_tool_manager.py","fields":["_wrapped","_mgr","active","handler_module_path"],"methods":["call()"],"sources":[["astrbot/core/provider/func_tool_manager.py",214,286],["astrbot/core/provider/func_tool_manager.py",496,514]],"explanation":{"role":"非内置 FunctionTool 的权限代理。FunctionToolManager 在提供工具集时创建它，在实际执行前检查当前事件是否允许使用被包装工具。","logic":["构造时复制原工具的名称、描述和参数，并保存 _wrapped 与 _mgr；代理自己的 handler 故意保持 None，使执行器进入重写 call 的路径。","call() 先由 manager._check_tool_permission() 读取配置并检查权限；有错误则直接返回错误信息。","通过后依次委托原工具 handler、重写的 call 或兼容 run；如果原处理器返回异步生成器，包装器消费并返回最后一项。"],"data":["外层是 _PermissionGuardedTool，_wrapped 才是原始插件工具或 MCPTool；上下文中 event 被用于权限判断和调用本地处理器。"],"caveats":["内置工具及其自身权限策略不能简单概括为都由此代理完成；包装后的 MCP 工具先以代理类型经过执行器，再由代理委托 MCPTool.call()。","这里的包装用于访问控制，与 MCPTool 将 MCP 描述适配成 FunctionTool 是两层不同作用。"],"sources":[["astrbot/core/provider/func_tool_manager.py",214,285],["astrbot/core/provider/func_tool_manager.py",460,513],["astrbot/core/astr_agent_tool_exec.py",685,717]]}},{"id":"aiocqhttp.convert_message","label":"AiocqhttpAdapter.convert_message()","kind":"function","group":"platform","x":420,"y":2350,"summary":"把 OneBot 原生事件、发送者/群信息和消息段转换为平台无关 AstrBotMessage。","file":"astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py","fields":["OneBot Event 输入"],"methods":["convert_message(event)"],"sources":[["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",128,197]],"explanation":{"role":"AiocqhttpAdapter 的重要转换方法，把 OneBot 事件分派给对应处理方法并得到 AstrBotMessage。","logic":["根据 Event 的 post_type，分别调用 _convert_handle_message_event、_convert_handle_notice_event 或 _convert_handle_request_event；指定发送者的消息被过滤为 None。","平台回调得到非空消息后调用 handle_msg，最终将其包装为事件并入队。"],"data":["输入是 OneBot Event；输出是 AstrBotMessage 或 None，不是完整的 AstrMessageEvent。"],"caveats":["图中此方法被提升为单独节点以突出转换，但它仍属于 AiocqhttpAdapter，并非独立类。"],"sources":[["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",64,102],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",128,141],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",509,510]]}},{"id":"aiocqhttp.create_event","label":"AiocqhttpAdapter.create_event()","kind":"function","group":"platform","x":420,"y":2510,"summary":"把 AstrBotMessage 包装为具体 AiocqhttpMessageEvent，注入平台元数据和 CQHttp 客户端。","file":"astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py","fields":["AstrBotMessage 输入"],"methods":["create_event(message)"],"sources":[["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",492,509]],"explanation":{"role":"AiocqhttpAdapter 的事件包装方法，为规范化消息创建该平台专用的事件子类。","logic":["从 AstrBotMessage 取 message_str 和 session_id，结合适配器 meta() 与 bot 创建 AiocqhttpMessageEvent；handle_msg 再调用 commit_event。"],"data":["AstrBotMessage → AiocqhttpMessageEvent；消息对象被保存在新事件中，bot 客户端供平台专用发送逻辑使用。"],"caveats":["该方法属于具体适配器；Platform 基类也有 create_event 的默认实现，但此处运行的是子类覆盖版本。"],"sources":[["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",492,510],["astrbot/core/platform/platform.py",151,165],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_message_event.py",23,33]]}},{"id":"collect_initial_request","importance":"key","label":"collect_initial_request()","kind":"function","group":"agent","x":1120,"y":2440,"summary":"从事件及可选请求收集输入，返回 (ProviderRequest | None, quoted_image_ref | None)；第二项供引用图片准备。","file":"astrbot/core/astr_main_agent.py","fields":["event","plugin_context","config","req"],"methods":["读取事件文本、媒体、引用和 Conversation","接收插件请求浅拷贝、显式 req 或新建请求","返回请求及 quoted image reference 二元组"],"sources":[["astrbot/core/astr_main_agent.py",1468,1565]],"explanation":{"role":"从当前事件、插件提供的请求和会话历史收集主 Agent 的初始输入，产生 ProviderRequest 和引用图片线索。它负责收集，不等于最终向模型发送请求。","logic":["没有显式 req 时，先检查 event.extra 中是否有 provider_request；有则做浅拷贝并复制部分列表，关联会话存在时重新加载历史，避免排队期间错过已保存的消息。","没有插件请求时新建 ProviderRequest，检查模型唤醒前缀并提取消息文本；前缀不匹配时返回 (None, None)。","读取消息中的图片、音频、文件和视频及引用消息附件；图片或音频不可用时按分支记录日志或添加占位，引用图片也可通过回退提取。","从会话服务获取当前 Conversation，将其 history 解析为 contexts，并把请求登记到事件的 provider_request 扩展字段；最后对图片引用去重并返回二元组。"],"data":["输入包括 AstrMessageEvent、插件 Context、MainAgentBuildConfig、可选 ProviderRequest 和可选引用图片集合。","输出是 (ProviderRequest | None, quote_image_ref | None)；第二项是引用消息中的首个嵌入图片引用，不是完整图片集合。"],"caveats":["浅拷贝不是对整个对象图的深拷贝；提供显式 req 时，其附件视为已收集，流程与新建请求不同。","插件请求关联的会话已不存在时，事件会记录错误并返回空结果。图片准备、模型能力判断和后续请求装饰由调用方继续处理。"],"sources":[["astrbot/core/astr_main_agent.py",1468,1538],["astrbot/core/astr_main_agent.py",1540,1598],["astrbot/core/astr_main_agent.py",1603,1668],["astrbot/core/astr_main_agent.py",1697,1731]]}},{"id":"run_agent","importance":"key","label":"run_agent()","kind":"function","group":"output","x":2520,"y":2110,"summary":"异步生成器，消费 AgentResponse 流并 yield MessageChain | None；非流式最终内容暂存为 event.result，流式内容由调用侧继续处理。","file":"astrbot/core/astr_agent_run_util.py","fields":["agent_runner：产出 AgentResponse 的 Runner","stream_to_general/show_tool_use/show_reasoning：控制结果处理策略","buffer_intermediate_messages：控制中间 LLM 链是否合并"],"methods":["run_agent(...) -> AsyncGenerator[MessageChain | None]","处理 AgentResponse、工具状态和增量结果","非流式/最终内容包装为 MessageEventResult 并写 event；流式块作为 MessageChain yield"],"sources":[["astrbot/core/astr_agent_run_util.py",115,225],["astrbot/core/astr_agent_run_util.py",225,350]],"explanation":{"role":"连接 AgentRunner 与事件处理流程的异步生成器：逐项解释 AgentResponse，并让上层在恰当时机处理结果。","logic":["循环消费 agent_runner.step()；工具调用和工具结果可记录追踪信息、发送状态消息或直接发送标记为 tool_direct_result 的消息。","普通/非流式结果将 resp.data['chain'].chain 包装成 MessageEventResult 写入 event，然后 yield 原 MessageChain；生成器恢复执行时清理 event.result。","原生流式分支对 streaming_delta 直接 yield MessageChain；按配置可能隐藏推理片段，也可能缓冲并合并普通 LLM 结果。","停止信号、aborted 和异常各有处理；异常时非流式可设置错误结果，流式则 yield 错误消息链。"],"data":["输入包括 AgentRunner、AstrMessageEvent 与显示/流式选项；产物为异步生成的 MessageChain 或 None，并伴随 event 状态和可能的直接发送副作用。"],"caveats":["yield 会暂停该函数，让外层处理当前结果后才继续执行；不能把 set_result 与紧随其后的 clear_result 当成连续无间隔的两步。","直接发送工具结果与经 Pipeline 的一般结果是不同分支。"],"sources":[["astrbot/core/astr_agent_run_util.py",115,155],["astrbot/core/astr_agent_run_util.py",188,245],["astrbot/core/astr_agent_run_util.py",246,309],["astrbot/core/astr_agent_run_util.py",314,355]]}},{"id":"_convert_conv_from_v2_to_v1","label":"_convert_conv_from_v2_to_v1()","kind":"function","group":"output","x":2170,"y":2290,"summary":"ConversationManager 的兼容转换方法，把 SQLModel 的 ConversationV2 转成旧接口仍使用的 Conversation；content 列表被 JSON 序列化到 history 字符串。","file":"astrbot/core/conversation_mgr.py","fields":["conv_v2：数据库返回的 ConversationV2","include_history：是否携带完整历史"],"methods":["_convert_conv_from_v2_to_v1(conv_v2, include_history=True) -> Conversation"],"sources":[["astrbot/core/conversation_mgr.py",62,88]],"explanation":{"role":"ConversationManager 的兼容转换：将数据库 ConversationV2 映射为旧接口使用的 Conversation 对象。","logic":["复制平台、用户、标题、人格和 token 等元数据；conversation_id 变成 cid，时间转为 UTC 时间戳。","include_history 为真时将 content 或空列表经 json.dumps 转为 history 字符串；为假时固定使用 '[]'。"],"data":["输入 ConversationV2.content 是列表或 None；输出 Conversation.history 是 JSON 字符串，两者并非同一表示。"],"caveats":["转换本身不读取数据库、不请求模型；需要向上追踪调用此方法的 get_conversation。"],"sources":[["astrbot/core/conversation_mgr.py",62,90],["astrbot/core/conversation_mgr.py",190,214]]}},{"id":"Conversation","importance":"key","label":"Conversation","kind":"record","group":"output","x":2170,"y":2470,"summary":"conversation_mgr.py 中的兼容 dataclass。history 是 JSON 字符串；collect_initial_request 用 json.loads 将它恢复成 ProviderRequest.contexts。","file":"astrbot/core/db/po.py","fields":["cid：对话 UUID","history：JSON 编码的对话消息字符串","platform_id/user_id/title/persona_id/token_usage：会话元数据"],"methods":[],"sources":[["astrbot/core/db/po.py",582,609]],"explanation":{"role":"保留给旧接口使用的对话记录数据类，包含对话标识、JSON 字符串形式的历史和展示元数据。","logic":["ConversationManager 从数据库查询 ConversationV2 后调用兼容转换方法，构造这个数据对象并返回给旧接口调用方。"],"data":["cid 为对外对话 UUID；history 是字符串而不是列表；persona_id、title、token_usage 等描述当前对话。"],"caveats":["不要把它与数据库映射的 ConversationV2 混为一谈：前者 history 是 JSON 字符串，后者 content 是 JSON 列承载的列表。","对话记录也不同于平台侧 PlatformMessageHistory；后者保存的平台消息有独立用途。"],"sources":[["astrbot/core/db/po.py",582,603],["astrbot/core/conversation_mgr.py",62,90],["astrbot/core/conversation_mgr.py",202,214]]}},{"id":"ConversationV2","importance":"key","label":"ConversationV2","kind":"record","group":"output","x":2170,"y":2650,"summary":"当前数据库中的 SQLModel 表记录，映射 conversations 表。content 直接以 JSON 列保存 OpenAI 格式消息列表。","file":"astrbot/core/db/po.py","fields":["inner_conversation_id：自增主键","conversation_id：对外 UUID","content：list[dict] JSON 历史","platform_id/user_id/title/persona_id/token_usage/时间戳"],"methods":[],"sources":[["astrbot/core/db/po.py",72,107]],"explanation":{"role":"SQLModel 数据表模型，映射 conversations 表，保存 Agent 对话历史及其索引元数据。","logic":["SQLiteDatabase 使用 conversation_id 查询该表并返回模型；ConversationManager 根据需要将它转换成旧 Conversation。","create_conversation 与 update_conversation 在数据库层创建或修改记录。"],"data":["inner_conversation_id 是自增数据库主键；conversation_id 是唯一对外 UUID；content 是 JSON 列，通常包含消息字典列表。","platform_id、user_id、persona_id 与 token_usage 提供会话归属和附加信息。"],"caveats":["content 是模型对话上下文，不应假定它与平台全部原始消息历史完全相同。"],"sources":[["astrbot/core/db/po.py",72,105],["astrbot/core/db/sqlite.py",355,360],["astrbot/core/db/sqlite.py",599,654]]}},{"id":"SQLiteDatabase","importance":"key","label":"SQLiteDatabase","kind":"class","group":"output","x":2170,"y":2110,"summary":"BaseDatabase 的 SQLite/SQLAlchemy 实现。通过 AsyncSession 执行 CRUD；initialize 创建 SQLModel 表并设置 SQLite 参数。","file":"astrbot/core/db/sqlite.py","fields":["db_path：data_v4.db 文件路径","DATABASE_URL：sqlite+aiosqlite URL","engine / AsyncSessionLocal：异步 SQLAlchemy 访问入口"],"methods":["initialize()：建表并设置 WAL、busy_timeout 等","get_conversation_by_id()：查 ConversationV2","create_conversation() / update_conversation()：保存和更新对话"],"sources":[["astrbot/core/db/sqlite.py",77,104],["astrbot/core/db/sqlite.py",355,382],["astrbot/core/db/sqlite.py",599,655]],"explanation":{"role":"BaseDatabase 的 SQLite 实现，为对话、定时任务和平台历史等数据提供异步持久化。","logic":["构造时以 db_path 生成 sqlite+aiosqlite 数据库 URL，再由基类准备数据库访问设施。","initialize 创建 SQLModel 中未存在的表，设置 WAL、busy_timeout 等 SQLite 参数，并执行若干兼容迁移与索引检查。","对话和定时任务方法通过数据库会话查询或写入对应表模型。"],"data":["db_path 指向本地 SQLite 文件；conversation_id 查询 ConversationV2，CronJob 方法操作定时任务记录。"],"caveats":["BaseDatabase 规定调用契约；实际 SQL 和数据库文件访问由此具体实现承担。","SQLite 文件是本地持久化边界，不等于单独的网络数据库服务。"],"sources":[["astrbot/core/db/sqlite.py",77,105],["astrbot/core/db/sqlite.py",355,360],["astrbot/core/db/sqlite.py",599,654],["astrbot/core/db/sqlite.py",2634,2670]]}},{"id":"OneBotProtocol","label":"OneBot V11 协议端 / Bot API","kind":"external","group":"external","x":70,"y":2940,"summary":"外部消息平台及 OneBot V11 兼容端。它向适配器提供原生 Event；发送时适配器将 MessageChain 转为 SDK 接受的消息参数并调用平台 API。该节点是协议边界，不是 AstrBot Python 类。","file":"","fields":["入站：OneBot Event / 原生 message segment","出站：send_group_msg / send_private_msg 的消息段参数"],"methods":[],"sources":[],"explanation":{"role":"图中表示项目与 OneBot 兼容端之间的外部协议边界；入站数据由 aiocqhttp 适配器接收，出站由其事件实现调用 Bot API。","logic":["AiocqhttpAdapter.convert_message 处理来自 SDK 的原生 Event，生成 AstrBotMessage 等内部表示。","发送时 AiocqhttpMessageEvent 将 MessageChain 转成消息段字典列表，并按会话类型调用 bot.send_group_msg 或 bot.send_private_msg；有些条件下回退到 bot.send。"],"data":["边界两侧分别是平台原生 Event/消息段与 AstrBotMessage、MessageChain/消息组件。"],"caveats":["这是外部协议及 SDK 调用边界，不是 AstrBot 的 Python 类。","仅依据项目调用点描述；兼容端的内部处理与成功送达不能由这里保证。"],"sources":[["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",128,150],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_message_event.py",68,120]]}},{"id":"SQLiteFile","label":"SQLite data_v4.db","kind":"external","group":"external","x":2170,"y":2940,"summary":"本地磁盘上的 SQLite 文件，是外部数据和持久化边界，既不是 Python 类，也不意味着远程服务。表结构由 SQLModel.metadata.create_all 建立，ConversationV2 映射 conversations 表。","file":"","fields":["路径由 astrbot.core.config.default.DB_PATH 指向 data_v4.db","conversations 表的 content 字段存 JSON 消息列表"],"methods":[],"sources":[["astrbot/core/config/default.py",38,38],["astrbot/core/db/po.py",72,107]],"explanation":{"role":"本地磁盘中的 SQLite 数据库文件边界，持久保存对话、定时任务和其他数据库表。","logic":["默认 DB_PATH 由数据目录与 data_v4.db 组合；SQLiteDatabase 使用异步 SQLite URL 连接并在初始化时创建或维护表结构。","ConversationV2 映射其中 conversations 表，其 content 列保存对话消息列表。"],"data":["数据库中的记录与 Python 中的 SQLModel 实例通过 SQLiteDatabase 的查询和写入方法转换。"],"caveats":["这是物理文件/持久化边界，不是 Python 类，也不是必然存在的远端数据库服务。"],"sources":[["astrbot/core/config/default.py",38,38],["astrbot/core/db/sqlite.py",77,103],["astrbot/core/db/po.py",72,96]]}},{"id":"LLMProviderAPI","label":"LLM Provider API","kind":"external","group":"external","x":1470,"y":2940,"summary":"OpenAI-compatible Chat Completions API 边界。请求 JSON 经 SDK 发出，服务端返回 ChatCompletion 或 stream chunks；具体连接和转换由 ProviderOpenAIOfficial 负责。","file":"","fields":["请求：model、messages、tools、tool_choice 与 extra_body","响应：ChatCompletion 或流式 chunk"],"methods":[],"sources":[],"explanation":{"role":"图中表示模型提供方的外部 HTTP/SDK 调用边界；本图以 ProviderOpenAIOfficial 所调用的 Chat Completions 接口为例。","logic":["Provider 将可用 ToolSet 转成 OpenAI 风格工具描述，并根据配置整理 payload 与 extra_body。","普通或流式方法调用 client.chat.completions.create，接收完成结果或流式数据后由项目中的解析逻辑转换。"],"data":["请求侧包含模型消息、可选工具描述、工具选择及额外参数；响应侧是 SDK 返回的完成结果或流式片段。"],"caveats":["该节点是外部服务边界，不是 Python 类；本项目中的调用不能证明提供方内部如何推理或存储数据。","此处为 OpenAI 兼容实现示例，不代表所有 Provider 都使用相同协议。"],"sources":[["astrbot/core/provider/sources/openai_source.py",535,588],["astrbot/core/provider/sources/openai_source.py",595,635],["astrbot/core/provider/sources/openai_source.py",839,850]]}},{"id":"MCPServer","label":"MCP Server","kind":"external","group":"external","x":1820,"y":2940,"summary":"外部 MCP 服务进程或远程端点。MCPClient 建立协议 session、发现工具并转发调用；服务返回的 MCP 内容由工具执行链进一步处理。","file":"","fields":["发现：tools/list → mcp.Tool{name, description, inputSchema}","调用：tools/call{name, arguments} → CallToolResult"],"methods":[],"sources":[],"explanation":{"role":"外部 MCP 服务边界，为本项目的 MCPClient 提供工具发现及工具调用能力。","logic":["MCPClient 建立 session 后，list_tools_and_save 调用 session.list_tools 并保存工具列表。","FunctionToolManager 将发现到的工具逐个包装成 MCPTool；MCPTool 调用时经 MCPClient.call_tool_with_reconnect 转发到 session.call_tool。"],"data":["发现结果由项目读取为工具列表，工具被包装时包含 mcp_tool、mcp_client 和 server 名称；调用时传递工具名及参数。"],"caveats":["MCPServer 是协议对端，不是 AstrBot 源码中的类；服务端内部实现及外部副作用超出本图可验证范围。","工具发现不等于工具已经被调用；注册包装和实际执行发生在不同阶段。"],"sources":[["astrbot/core/agent/mcp_client.py",653,665],["astrbot/core/agent/mcp_client.py",726,765],["astrbot/core/agent/mcp_client.py",793,820],["astrbot/core/provider/func_tool_manager.py",694,713]]}},{"id":"ProfileConfigData","label":"配置文件与路由映射","kind":"external","group":"external","x":420,"y":2940,"summary":"持久化配置数据边界，包括默认和多 profile 配置文件，以及 SharedPreferences 中保存的 profile 元数据和 UMOP 路由映射；它们并非同一个文件。","file":"","fields":["cmd_config.json、abconf_*.json：配置内容","abconf_mapping：profile 的名称和文件路径元数据","umop_config_routing：消息来源模式到 profile ID 的映射"],"methods":[],"sources":[["astrbot/core/astrbot_config_mgr.py",49,101],["astrbot/core/umop_config_router.py",14,25],["astrbot/core/config/astrbot_config.py",22,23]],"explanation":{"role":"图中的配置数据边界：包含配置档案及用于按消息来源选择档案的持久化信息。","logic":["AstrBotConfigManager 管理配置对象与档案元数据；UmopConfigRouter 管理消息来源模式到配置 ID 的映射。","事件路由按 UMO 查询配置档案，随后选择相应 PipelineScheduler；配置记录提供的是决策数据，具体路由由代码完成。"],"data":["配置内容、abconf_mapping 元数据与 umop_config_routing 映射是不同数据，不应合并想象成同一个文件。"],"caveats":["这是多种配置存储的概念边界，不是单个源码类或单个固定文件。"],"sources":[["astrbot/core/astrbot_config_mgr.py",49,101],["astrbot/core/astrbot_config_mgr.py",172,190],["astrbot/core/umop_config_router.py",14,25],["astrbot/core/event_bus.py",55,73]]}}],"edges":[{"id":"e01","from":"InitialLoader","to":"AstrBotCoreLifecycle","kind":"calls","label":"构造并启动","main":true,"details":{"when":"进程入口 main_async 创建 InitialLoader 后。","steps":["InitialLoader.start() 创建 AstrBotCoreLifecycle","await lifecycle.initialize()；失败则记录致命错误并返回","initialize 成功后调用 lifecycle.start()"],"dataFlow":["db/log_broker/webui_dir → AstrBotCoreLifecycle"],"result":"Core 进入常驻运行态。","sources":[["astrbot/core/initial_loader.py",17,57]]}},{"id":"e02","from":"AstrBotCoreLifecycle","to":"AstrBotConfigManager","kind":"calls","label":"初始化配置档案","main":true,"details":{"when":"initialize() 的配置准备阶段。","steps":["创建/初始化 AstrBotConfigManager","加载 abconf mapping 和各 profile 文件","为后续 scheduler、平台、Provider 提供配置对象"],"dataFlow":["配置文件 → AstrBotConfig","UMO 路由表 → UmopConfigRouter"],"result":"配置档案可按 conf_id 和 UMO 查询。","sources":[["astrbot/core/core_lifecycle.py",157,220],["astrbot/core/astrbot_config_mgr.py",32,80]]}},{"id":"e03","from":"AstrBo :"creates","label":"生成 UMO","main":true,"details":{"when":"AstrMessageEvent.__init__()。","steps":["读取 message_obj.type 和 platform_meta.id","创建 MessageSession(platform_name, message_type, session_id)","unified_msg_origin 调用 MessageSession.__str__()"],"dataFlow":["platform_id + message_type + session_id → MessageSession → UMO"],"result":"UMO 被 EventBus 用来选择配置档案，也被会话/历史组件用作稳定键。","sources":[["astrbot/core/platform/astr_message_event.py",104,155],["astrbot/core/platform/message_session.py",7,30]]}},{"id":"e16","from":"Platform","to":"EventBus","kind":"routes","label":"commit_event() 入队","main":true,"details":{"when":"具体 Adapter 完成 create_event 后调用 handle_msg/commit_event。","steps":["Platform.commit_event(event)","event_queue.put_nowait(event)","EventBus.dispatch() await queue.get()"],"dataFlow":["AstrMessageEvent → asyncio.Queue"],"result":"Platform 与 EventBus 通过共享 asyncio.Queue 通信，并非直接调用。","conditions":"停用的平台会被 EventBus.stopped_platforms 拒绝或取消。","sources":[["astrbot/core/platform/platform.py",147,151],["astrbot/core/event_bus.py",55,75]]}},{"id":"e17","from":"EventBus","to":"AstrBotConfigManager","kind":"routes","label":"按 UMO 取 ConfInfo","main":true,"details":{"when":"dispatch() 消费事件后。","steps":["event.unified_msg_origin","astrbot_config_mgr.get_conf_info(umo)","得到 conf_id/conf_name/path"],"dataFlow":["AstrMessageEvent.unified_msg_origin → ConfInfo"],"result":"为 PipelineScheduler 查找准备 conf_id。","sources":[["astrbot/core/event_bus.py",55,75],["astrbot/core/astrbot_config_mgr.py",131,180]]}},{"id":"e18","from":"EventBus","to":"PipelineScheduler","kind":"routes","label":"conf_id → scheduler.execute","main":true,"details":{"when":"EventBus 已取得 conf_id。","steps":["pipeline_scheduler_mapping.get(conf_id)","_apply_session_isolation(event, scheduler.ctx.astrbot_config)","asyncio.create_task(scheduler.execute(event))"],"dataFlow":["conf_id + AstrMessageEvent → PipelineScheduler.execute(event)"],"result":"事件进入对应 profile 的 Stage 洋葱模型。","conditions":"找不到 scheduler 时记录错误并忽略事件。","sources":[["astrbot/core/event_bus.py",55,75],["astrbot/core/event_bus.py",104,124]]}},{"id":"e19","from":"PipelineScheduler","to":"PipelineContext","kind":"owns","label":"共享 profile 上下文","main":true,"details":{"when":"Scheduler 初始化和每个 Stage.initialize(ctx) 时。","steps":["PipelineScheduler.__init__(context)","initialize() 遍历 registered_stages","每个 Stage 共享同一个 ctx"],"dataFlow":["AstrBotConfig + PluginManager + DB → PipelineContext"],"result":"Stage 不需要重复查找全局服务，所有阶段看到同一 profile 配置。","sources":[["astrbot/core/pipeline/context.py",16,24],["astrbot/core/pipeline/scheduler.py",20,36]]}},{"id":"e20","from":"PipelineScheduler","to":"Stage","kind":"calls","label":"洋葱模型执行","main":true,"details":{"when":"PipelineScheduler.execute(event)。","steps":["调用 stage.process(event)","普通 coroutine await 后继续","async generator 在 yield 前执行前置逻辑","递归执行后续 Stage，再回到 yield 后执行后置逻辑"],"dataFlow":["AstrMessageEvent 在所有 Stage 间原地共享","event.stop_event() → 截断后续阶段"],"result":"Pipeline 既能前置拦截，也能在下游完成后做后置装饰。","sources":[["astrbot/core/pipeline/scheduler.py",38,102]]}},{"id":"e21","from":"WakingCheckStage","to":"Stage","kind":"inherits","label":"具体阶段实现","main":false,"details":{"when":"内置 Stage 注册。","steps":["WakingCheckStage 继承 Stage","读取 PipelineContext 配置和插件注册表","写入 event.extras['activated_handlers']"],"dataFlow":["AstrMessageEvent → wake/handler metadata"],"result":"后续 ProcessStage 知道哪些插件 handler 被激活。","sources":[["astrbot/core/pipeline/stage.py",19,42],["astrbot/core/pipeline/waking_check/stage.py",63,205]]}},{"id":"e22","from":"ProcessStage","to":"Stage","kind":"inherits","label":"具体阶段实现","main":true,"details":{"when":"Stage 顺序到 ProcessStage。","steps":["ProcessStage 继承 Stage","先处理 SessionWaiter","再进入插件/Agent 分流"],"dataFlow":["event.extras + event.result + stop flag → 分流条件"],"result":"插件 handler 和默认 Agent 共用同一个事件状态。","sources":[["astrbot/core/pipeline/process_stage/stage.py",14,76]]}},{"id":"e23","from":"ResultDecorateStage","to":"Stage","kind":"inherits","label":"具体阶段实现","main":false,"details":{"when":"Agent/插件处理返回后，洋葱模型回程。","steps":["读取 event.get_result()","调用结果装饰钩子和组件变换","写回 event.result"],"dataFlow":["MessageEventResult → decorated MessageEventResult"],"result":"RespondStage 看到的是最终投递形态。","sources":[["astrbot/core/pipeline/result_decorate/stage.py",22,150]]}},{"id":"e24","from":"RespondStage","to":"Stage","kind":"inherits","label":"具体阶段实现","main":true,"details":{"when":"ResultDecorateStage 完成后。","steps":["读取 event.get_result()","按 streaming/content type 和平台能力选择发送策略","调用 event.send 或 event.send_streaming"],"dataFlow":["MessageEventResult → platform event send"],"result":"消息抵达具体平台 API。","sources":[["astrbot/core/pipeline/respond/stage.py",44,80],["astrbot/core/pipeline/respond/stage.py",194,398]]}},{"id":"e25","from":"ProcessStage","to":"StarRequestSubStage","kind":"calls","label":"插件 handler 分支","main":true,"details":{"when":"event.extras 中有 activated_handlers。","steps":["ProcessStage.process(event)","StarRequestSubStage 读取 handlers_parsed_params","通过 PluginManager 找到 handler_module_path","call_handler(event, handler, **params)"],"dataFlow":["handler return → event.result / event.stop_event / ProviderRequest"],"result":"插件可以直接结束事件，也可以把预置 ProviderRequest 交给 Agent。","conditions":"插件异常会触发 OnPluginErrorEvent；stop_event 会阻止默认 Agent。","sources":[["astrbot/core/pipeline/process_stage/stage.py",43,76],["astrbot/core/pipeline/process_stage/method/star_request.py",20,100]]}},{"id":"e26","from":"ProcessStage","to":"AgentRequestSubStage","kind":"calls","label":"默认 Agent 分支","main":true,"details":{"when":"没有被插件结果/停止标志截断，且 profile/provider/session 条件允许。","steps":["ProcessStage 判断 call_llm/is_wake/has_send_oper","AgentRequestSubStage.normalize_agent_runner()","SessionServiceManager.should_process_llm_request(event)","按 runner_type 选择 Internal 或 ThirdParty"],"dataFlow":["AstrMessageEvent + event.extras['provider_request'] → Agent sub-stage"],"result":"事件进入一次 Agent 构建和执行。","sources":[["astrbot/core/pipeline/process_stage/stage.py",62,76],["astrbot/core/pipeline/process_stage/method/agent_request.py",14,80]]}},{"id":"e27","from":"PluginManager","to":"WakingCheckStage","kind":"provides","label":"handler 注册表","main":false,"details":{"when":"WakingCheckStage.process(event)。","steps":["插件加载时注册 StarHandlerMetadata 到模块级 star_handlers_registry","WakingCheckStage 访问注册表并匹配过滤器","匹配结果写入 event extras；注册表不是 PluginManager 实例字段"],"dataFlow":["StarHandlerMetadata → activated_handlers/handlers_parsed_params"],"result":"StarRequestSubStage 可以无反射地定位并调用插件 handler。","sources":[["astrbot/core/pipeline/waking_check/stage.py",145,205],["astrbot/core/star/star_manager.py",193,280]]}},{"id":"e28","from":"AgentRequestSubStage","to":"InternalAgentSubStage","kind":"calls","label":"local runner","main":true,"details":{"when":"runner_type=local 且 SessionServiceManager 允许。","steps":["创建/取得 InternalAgentSubStage","会话锁内读取当前 profile config","调用 build_main_agent(event, plugin_context, build_config)","消费 runner.step()/run_agent()"],"dataFlow":["AstrMessageEvent → MainAgentBuildConfig → MainAgentBuildResult"],"result":"本地 ToolLoopAgentRunner 产生 AgentResponse 并写回 event.result。","sources":[["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",78,130],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",221,325]]}},{"id":"e29","from":"AgentRequestSubStage","to":"ThirdPartyAgentSubStage","kind":"calls","label":"external runner","main":false,"details":{"when":"runner_type 为 Dify/Coze/Dashscope/DeerFlow 等外部 Agent。","steps":["normalize_agent_runner()","构造第三方 runner","聚合流式/非流式响应","统一转换为 AgentResponse"],"dataFlow":["外部 Agent API response → AgentResponse → event.result"],"result":"外部 Agent 与本地 Agent 共享后续 ResultDecorate/Respond 阶段。","sources":[["astrbot/core/pipeline/process_stage/method/agent_sub_stages/third_party.py",157,178],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/third_party.py",280,365]]}},{"id":"e30","from":"InternalAgentSubStage","to":"MainAgentBuildConfig","kind":"creates","label":"组装构建参数","main":true,"details":{"when":"初始化时建立默认构建配置；process(event) 获得会话锁后使用 replace 更新请求级配置。","steps":["InternalAgentSubStage.initialize() 从配置创建 self.main_agent_cfg","process() 根据此次唤醒前缀和流式设置调用 replace()","更新后的 MainAgentBuildConfig 单独传给 build_main_agent()"],"dataFlow":["profile config → MainAgentBuildConfig → replace(...) 后的 config"],"result":"事件和可选 ProviderRequest 是 build_main_agent 的独立参数，不属于 MainAgentBuildConfig。","sources":[["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",221,325],["astrbot/core/astr_main_agent.py",189,250]]}},{"id":"e31","from":"InternalAgentSubStage","to":"MainAgentBuildResult","kind":"consumes","label":"接收 Agent 组合结果","main":true,"details":{"when":"await build_main_agent(...) 完成。","steps":["取得 agent_runner/provider_request/provider/reset_coro","注册 active runner","调用 run_agent 或 run_live_agent","最终释放 runner 并保存历史"],"dataFlow":["MainAgentBuildResult → runner + request + provider"],"result":"Agent 执行阶段从构建阶段解耦。","sources":[["astrbot/core/astr_main_agent.py",1734,1809],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",394,480]]}},{"id":"e32","from":"Context","to":"ProviderManager","kind":"calls","label":"选择当前 Provider","main":true,"details":{"when":"build_main_agent._select_provider()。","steps":["Context.get_using_provider_async(umo/provider_id)","ProviderManager._resolve_using_provider()","按 profile/UMO/provider type 返回实例"],"dataFlow":["UMO + profile provider setting → Provider"],"result":"Agent runner 获得本轮要调用的模型服务。","conditions":"没有 provider 或类型无效时写入 LLM 错误结果并结束构建。","sources":[["astrbot/core/star/context.py",529,560],["astrbot/core/astr_main_agent.py",273,317],["astrbot/core/provider/manager.py",244,365]]}},{"id":"e33","from":"build_main_agent","to":"collect_initial_request","kind":"calls","label":"收集请求数据","main":true,"details":{"when":"build_main_agent() 收到 event 和可选的预制请求时。","steps":["build_main_agent() 在 req 为空或需要补引用数据时调用","函数可能浅拷贝插件预制 ProviderRequest、接收显式 req 或新建 req","从 event 与 Conversation 收集 prompt、媒体和历史","返回 (ProviderRequest | None, quoted_image_ref | None)"],"dataFlow":["AstrMessageEvent + Context + config + optional req → (ProviderRequest | None, quoted_image_ref | None)"],"result":"请求继续由 build_main_agent 补充图像、知识库、工具和 system prompt。","sources":[["astrbot/core/astr_main_agent.py",1468,1565],["astrbot/core/astr_main_agent.py",1734,1800]]}},{"id":"e34","from":"ProviderManager","to":"Provider","kind":"provides","label":"返回 Provider 实例","main":true,"details":{"when":"_resolve_using_provider() 选定 provider type/id 后。","steps":["根据当前会话、配置和 provider_id 查找已加载实例","选择适用 Provider；找不到时返回空"],"dataFlow":["provider config → Provider instance"],"result":"Runner 依赖 Provider 契约；具体厂商子类负责协议转换。","sources":[["astrbot/core/provider/manager.py",244,365],["astrbot/core/provider/provider.py",33,221]]}},{"id":"e35","from":"Provider","to":"AbstractProvider","kind":"inherits","label":"实现 Provider 契约","main":false,"details":{"when":"Provider 家族初始化。","steps":["Provider 实现 AbstractProvider","扩展 text_chat/text_chat_stream、模型和多模态能力","厂商 source 继续继承 Provider"],"dataFlow":["ProviderRequest → vendor payload → LLMResponse"],"result":"不同厂商都能被 ToolLoopAgentRunner 统一调用。","sources":[["astrbot/core/provider/provider.py",33,221]]}},{"id":"e36","from":"ToolLoopAgentRunner","to":"ContextManager","kind":"calls","label":"整理上下文","main":true,"details":{"when":"每次 runner.step() 请求 Provider 前。","steps":["ContextManager.process(run_context.messages)","按 token 配置截断或压缩","生成本轮 Message 列表和 checkpoint"],"dataFlow":["Message[] → processed Message[]"],"result":"上下文长度在 Provider 请求前受到控制。","sources":[["astrbot/core/agent/runners/tool_loop_agent_runner.py",807,870],["astrbot/core/agent/context/manager.py",11,156]]}},{"id":"e37","from":"ToolLoopAgentRunner","to":"Provider","kind":"calls","label":"text_chat / stream","main":true,"details":{"when":"runner.step() 没有被停止且需要下一轮 LLM。","steps":["把 ProviderRequest 和 ContextManager 产出的 messages 送入 Provider.text_chat 或 text_chat_stream","处理 fallback provider/retry","接收统一 LLMResponse"],"dataFlow":["ProviderRequest + Message[] + ToolSet schema → LLMResponse"],"result":"无工具调用时可直接产生 AgentResponse；有工具调用时进入执行分支。","sources":[["astrbot/core/agent/runners/tool_loop_agent_runner.py",807,1070],["astrbot/core/provider/provider.py",75,180]]}},{"id":"e38","from":"ProviderOpenAIOfficial","to":"LLMResponse","kind":"produces","label":"解析为统一响应","main":true,"details":{"when":"ProviderOpenAIOfficial 收到 OpenAI-compatible ChatCompletion 后。","steps":["_query() 收到 SDK ChatCompletion","_parse_openai_completion() 提取文本、reasoning、tool calls 和 usage","创建 LLMResponse 并返回 ToolLoopAgentRunner"],"dataFlow":["openai.types.ChatCompletion → LLMResponse{result_chain, tools_call_name, tools_call_args, tools_call_ids, usage}"],"result":"Runner 消费统一 LLMResponse，不需要依赖 OpenAI SDK 的响应对象。","sources":[["astrbot/core/provider/sources/openai_source.py",532,590],["astrbot/core/provider/sources/openai_source.py",838,955]]}},{"id":"e39","from":"LLMResponse","to":"ToolLoopAgentRunner","kind":"calls","label":"tool_call 决策","main":true,"details":{"when":"LLMResponse.tools_call_* 非空。","steps":["runner._handle_function_tools() 解析 ToolCall id/name/arguments","ToolSet.get_tool(name) 查找工具","交给 FunctionToolExecutor.execute"],"dataFlow":["LLMResponse.tool_calls → ToolCall → FunctionTool"],"result":"工具执行结果会追加回 ProviderRequest，下一轮重新请求 Provider。","conditions":"找不到工具、参数无效或工具失败时生成错误 ToolCallsResult，仍可进入下一轮。","sources":[["astrbot/core/agent/runners/tool_loop_agent_runner.py",1178,1244],["astrbot/core/agent/message.py",144,178]]}},{"id":"e40","from":"FunctionToolManager","to":"ToolSet","kind":"provides","label":"汇总可见工具","main":true,"details":{"when":"build_main_agent 组装工具集。","steps":["当 persona 未指定 tools 或 tools 为 null，调用 FunctionToolManager.get_full_tool_set()","get_full_tool_set() 将 func_list 中非内置工具包装成 _PermissionGuardedTool 后加入 ToolSet","当 persona 明确列 tools 时，build_main_agent 改用 get_func(name) 逐项选择；这些对象不一定经统一权限 wrapper","内置工具通常通过 get_builtin_tool() 单独加入请求"],"dataFlow":["插件工具 / MCPTool → _PermissionGuardedTool → ToolSet；内置工具按需追加"],"result":"ToolSet 既向 Provider 提供 schema，也供 Runner 按名称查找实际工具；要判断权限路径需结合 persona 配置来源。","sources":[["astrbot/core/provider/func_tool_manager.py",496,514],["astrbot/core/agent/tool.py",79,160],["astrbot/core/astr_main_agent.py",640,672]],"conditions":"persona 的工具选择方式会影响是否经过 _PermissionGuardedTool：默认 full set 会包裹非内置工具，显式 persona.tools 路径可能直接取工具；工具自身或执行器的特判逻辑仍可能执行额外检查。"}},{"id":"e41","from":"ToolSet","to":"FunctionTool","kind":"owns","label":"按名称持有工具","main":true,"details":{"when":"Agent 请求包含 func_tool 时。","steps":["ToolSet 以 tools 列表保存工具，并按 name 查找","get_tool(name) 返回对应 FunctionTool 对象","openai_schema()/anthropic_schema()/google_schema() 生成对应供应商的工具描述"],"dataFlow":["FunctionTool.name/description/parameters → provider tool schema"],"result":"同一工具对象同时服务 LLM schema 和执行阶段。","sources":[["astrbot/core/agent/tool.py",21,160]]}},{"id":"e42","from":"FunctionToolExecutor","to":"BaseFunctionToolExecutor","kind":"inherits","label":"实现执行器契约","main":false,"details":{"when":"Agent 构建阶段创建执行器。","steps":["FunctionToolExecutor 实现 BaseFunctionToolExecutor[AstrAgentContext]","execute() 根据工具类型分流","结果统一返回 ToolExecResult/CallToolResult"],"dataFlow":["ToolCall + AstrAgentContext → execution result"],"result":"Runner 不关心本地、MCP、handoff 的具体执行方式。","sources":[["astrbot/core/agent/tool_executor.py",10,17],["astrbot/core/astr_agent_tool_exec.py",61,205]]}},{"id":"e43","from":"FunctionToolExecutor","to":"FunctionTool","kind":"calls","label":"本地工具分支","main":true,"details":{"when":"工具不是 MCP/handoff/background 特殊类型。","steps":["_execute_local() 调 tool.handler/call/run","把返回值转换成 mcp.types.CallToolResult/TextContent","必要时转成 MessageChain 或 event.send"],"dataFlow":["ToolCall arguments → local handler → CallToolResult/MessageChain"],"result":"本地工具的结果可被模型消费，也可直接发送给用户。","sources":[["astrbot/core/astr_agent_tool_exec.py",136,205],["astrbot/core/astr_agent_tool_exec.py",685,781]]}},{"id":"e44","from":"FunctionToolManager","to":"MCPTool","kind":"wraps","label":"MCP 原始工具 → FunctionTool","main":true,"details":{"when":"FunctionToolManager.init_mcp_clients() 连接 MCP server 后。","steps":["FunctionToolManager 启动 MCPClient.connect_to_server()","MCPClient.list_tools_and_save() 从服务获取 mcp.Tool 列表","FunctionToolManager 为每个工具构造 MCPTool 并存入 func_list"],"dataFlow":["mcp.Tool{name, description, inputSchema} → MCPTool{mcp_tool, mcp_client, mcp_server_name}"],"result":"MCPClient 提供原始工具列表，包装由 FunctionToolManager 完成。","sources":[["astrbot/core/provider/func_tool_manager.py",540,760],["astrbot/core/agent/mcp_client.py",465,660],["astrbot/core/agent/mcp_client.py",793,817]]}},{"id":"e45","from":"MCPTool","to":"FunctionTool","kind":"inherits","label":"复用工具契约","main":false,"details":{"when":"MCPTool 类定义。","steps":["MCPTool 继承 FunctionTool","对 LLM 暴露规范化名称及 schema","通过 mcp_tool.name 保留服务端原名，并保存 mcp_client"],"dataFlow":["MCP schema → MCPTool / FunctionTool schema"],"result":"MCP 与本地工具在 ToolSet 层统一。","sources":[["astrbot/core/agent/mcp_client.py",793,817],["astrbot/core/agent/tool.py",21,76]]}},{"id":"e46","from":"FunctionToolExecutor","to":"MCPTool","kind":"calls","label":"MCP 工具分支","main":true,"details":{"when":"execute() 判断 tool 是 MCPTool。","steps":["若执行器直接收到 MCPTool，则 execute() 进入 _execute_mcp() 并调用 MCPTool.call()","若来自 get_full_tool_set()，通常先由 _PermissionGuardedTool.call() 做权限校验，再调用底层 MCPTool.call()","MCPTool 使用 mcp_tool.name 和参数调用 MCPClient.call_tool_with_reconnect()"],"dataFlow":["工具参数 → 权限包装（如有）→ MCPTool → MCPClient → mcp.CallToolResult"],"result":"工具结果交还 Runner，供其转换后加入后续上下文。","conditions":"连接失效时 MCPClient 尝试重连；仍失败则返回错误结果。","sources":[["astrbot/core/astr_agent_tool_exec.py",782,793],["astrbot/core/agent/mcp_client.py",726,817]]}},{"id":"e47","from":"ToolLoopAgentRunner","to":"ToolCallsResult","kind":"produces","label":"工具结果回写请求","main":true,"details":{"when":"FunctionToolExecutor 完成工具执行。","steps":["执行结果转为 ToolCallMessageSegment，和 assistant ToolCall 信息组成 ToolCallsResult","Runner 将 ToolCallsResult.to_openai_messages_model() 追加到 ContextWrapper.messages","同时 req.append_tool_calls_result() 保存工具调用批次","下一轮 Provider 调用接收更新后的 contexts 和 tool_calls_result"],"dataFlow":["CallToolResult → ToolCallMessageSegment → ToolCallsResult → ContextWrapper.messages + ProviderRequest.tool_calls_result"],"result":"LLM 下一轮上下文包含对应 tool_call_id 的结果；结果不是写入 ProviderRequest.contexts 字段。","sources":[["astrbot/core/agent/runners/tool_loop_agent_runner.py",1095,1150],["astrbot/core/provider/entities.py",169,184],["astrbot/core/provider/entities.py",194,250]]}},{"id":"e48","from":"ToolLoopAgentRunner","to":"AgentResponse","kind":"produces","label":"输出 AgentResponse","main":true,"details":{"when":"LLMResponse 无需继续工具调用，或流式增量可向上交付时。","steps":["ToolLoopAgentRunner.step() 产出 AgentResponse","AgentResponse.data.chain 包含 MessageChain","run_agent() 消费流，根据类型处理结果、状态和增量"],"dataFlow":["LLMResponse / 工具结果 → MessageChain → AgentResponse"],"result":"InternalAgentSubStage/run_agent 可以消费统一流，而不用理解 Provider 原始对象。","sources":[["astrbot/core/astr_agent_run_util.py",115,225],["astrbot/core/agent/response.py",8,32]]}},{"id":"e49","from":"InternalAgentSubStage","to":"run_agent","kind":"calls","label":"消费 Runner 响应流","main":true,"details":{"when":"InternalAgentSubStage 已构造并启动本地 Agent Runner 时。","steps":["InternalAgentSubStage 将本地 Runner 传给 run_agent()","run_agent() 消费 AgentResponse 异步流并 yield MessageChain | None","非流式/最终结果暂存为 event.result；流式块由调用侧交付","Agent 结束后保存 Conversation 和平台历史"],"dataFlow":["ToolLoopAgentRunner.step() → AgentResponse → run_agent()"],"result":"AgentResponse 与 Pipeline 的 MessageEventResult 是两层不同包装。","sources":[["astrbot/core/astr_agent_run_util.py",115,225],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",394,480]]}},{"id":"e50","from":"AgentResponse","to":"MessageChain","kind":"wraps","label":"统一输出链","main":true,"details":{"when":"run_agent 把 runner 输出转换成事件结果。","steps":["AgentResponse.data.chain 取出 MessageChain","MessageChain 保存 BaseMessageComponent 列表","必要时合并流式片段、工具状态和最终文本"],"dataFlow":["AgentResponse → MessageChain[BaseMessageComponent]"],"result":"MessageChain 可被 MessageEventResult 和平台事件发送边界复用。","sources":[["astrbot/core/agent/response.py",8,16],["astrbot/core/message/message_event_result.py",18,193]]}},{"id":"e51","from":"MessageChain","to":"MessageEventResult","kind":"wraps","label":"事件结果元数据","main":true,"details":{"when":"InternalAgentSubStage 或插件写入最终结果时。","steps":["MessageEventResult 继承 MessageChain","构造时传入 chain，并设置 result_type、result_content_type 或 async_stream","调用 event.set_result(result)"],"dataFlow":["组件 chain + 结果类型 / 流 → MessageEventResult"],"result":"RespondStage 可以按结果类型选择发送方式。","sources":[["astrbot/core/message/message_event_result.py",195,288]]}},{"id":"e52","from":"ResultDecorateStage","to":"MessageEventResult","kind":"reads","label":"读取并装饰结果","main":true,"details":{"when":"PipelineScheduler 从下游 Stage 回到结果装饰阶段。","steps":["ResultDecorateStage 读取 event.get_result()","执行插件装饰钩子、前缀/分段/安全检查/TTS/T2I","写回新的 MessageEventResult"],"dataFlow":["MessageEventResult → decorated MessageEventResult"],"result":"发送阶段看到的是已经完成平台前处理的结果。","sources":[["astrbot/core/pipeline/result_decorate/stage.py",22,150]]}},{"id":"e53","from":"PipelineScheduler","to":"RespondStage","kind":"calls","label":"调度发送阶段","main":true,"details":{"when":"结果装饰完成且事件未 stop。","steps":["Scheduler 根据 STAGES_ORDER 调度各阶段","ResultDecorateStage 装饰 event 上的结果","RespondStage 读取同一个 event.result 并选择发送方式"],"dataFlow":["decorated MessageEventResult → send/send_streaming"],"result":"Scheduler 按 STAGES_ORDER 调度；ResultDecorateStage 不直接调用 RespondStage。","sources":[["astrbot/core/pipeline/stage_order.py",1,15],["astrbot/core/pipeline/respond/stage.py",194,398]]}},{"id":"e54","from":"RespondStage","to":"AstrMessageEvent","kind":"sends","label":"event.send() / send_streaming()","main":true,"details":{"when":"RespondStage.process(event) 已选择发送策略。","steps":["event.get_result() 取得结果","event.send(...) 或 event.send_streaming(...)","具体事件子类转换 MessageChain 组件并调用平台客户端"],"dataFlow":["MessageEventResult.chain → AstrMessageEvent.send"],"result":"平台收到可发送的统一组件链；发送后触发 after-sent hook 并清理结果。","sources":[["astrbot/core/pipeline/respond/stage.py",297,398],["astrbot/core/platform/astr_message_event.py",534,564]]}},{"id":"e55","from":"AstrMessageEvent","to":"AiocqhttpMessageEvent","kind":"calls","label":"动态分发 send（示例）","main":true,"details":{"when":"事件实际类型为 AiocqhttpMessageEvent，RespondStage 调用 event.send() 时。","steps":["Python 按实际实例类型调用 AiocqhttpMessageEvent.send()","具体实现将 MessageChain 转为 OneBot 消息段并使用 CQHttp 发送","super().send() 记录公共发送状态和指标"],"dataFlow":["MessageEventResult.chain → MessageChain → OneBot payload"],"result":"本边仅展示一种平台实现，WebChat 与其他适配器有各自发送逻辑。","sources":[["astrbot/core/pipeline/respond/stage.py",194,398],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_message_event.py",127,220]]}},{"id":"e56","from":"CronJobManager","to":"CronMessageEvent","kind":"creates","label":"Cron 构造事件旁路","main":false,"details":{"when":"active_agent Cron 到点触发。","steps":["_run_active_agent_job() 生成 session/cron_job/cron_payload","_woke_main_agent() 构造 CronMessageEvent","把 cron prompt 和 extras 放入事件"],"dataFlow":["CronJob + payload + session → CronMessageEvent"],"result":"Cron 获得和普通事件相似的 event/context 数据，但不入 EventBus。","sources":[["astrbot/core/cron/manager.py",437,510],["astrbot/core/cron/events.py",17,74]]}},{"id":"e57","from":"CronJobManager","to":"ToolLoopAgentRunner","kind":"calls","label":"直接 build_main_agent + step_until_done","main":false,"details":{"when":"Cron active_agent 任务。","steps":["_woke_main_agent() 构造 ProviderRequest 和 MainAgentBuildConfig","调用 build_main_agent() 构建 runner","消费 runner 执行结果并按条件保存历史"],"dataFlow":["CronMessageEvent + ProviderRequest → ToolLoopAgentRunner → AgentResponse"],"result":"Cron 直达 Agent，绕过 EventBus 和 PipelineScheduler。","conditions":"Cron 的最终文本由 runner.get_final_llm_resp() 用于构造 summary_note 并保存历史，不会自动发给用户。主动送达依赖 SendMessageToUserTool 或其他明确 send 调用。_woke_main_agent 仅在 delivery_session_str 非空时显式添加发送工具；build_main_agent 也可能依据平台能力追加。","sources":[["astrbot/core/cron/manager.py",473,596]]}},{"id":"e58","from":"CronMessageEvent","to":"Context","kind":"calls","label":"持久会话发送","main":false,"details":{"when":"Cron Agent 或 SendMessageToUserTool 要发送消息。","steps":["CronMessageEvent.send() 调 Context.send_message(session, chain)","Context 解析 MessageSession","遍历 PlatformManager.platform_insts 找到匹配平台","调用 platform.send_by_session(session, chain)"],"dataFlow":["MessageSession + MessageChain → Context → Platform.send_by_session"],"result":"Cron 消息可以在没有普通用户事件对象的情况下发送。","sources":[["astrbot/core/cron/events.py",63,73],["astrbot/core/star/context.py",665,748]]}},{"id":"e59","from":"ConversationManager","to":"Conversation","kind":"produces","label":"返回兼容会话对象","main":true,"details":{"when":"collect_initial_request 通过 Context.conversation_manager 读取当前对话。","steps":["get_conversation() 按 conversation_id 调 BaseDatabase.get_conversation_by_id()","数据库返回 ConversationV2 后调用 _convert_conv_from_v2_to_v1()","返回 Conversation 给请求收集流程"],"dataFlow":["ConversationV2{content: list[dict]} → Conversation{history: JSON string}"],"result":"兼容对象供旧接口消费；history 随后由 collect_initial_request 解码到 ProviderRequest.contexts。","sources":[["astrbot/core/conversation_mgr.py",190,215],["astrbot/core/conversation_mgr.py",62,88]]}},{"id":"e60","from":"ConversationManager","to":"BaseDatabase","kind":"calls","label":"通过数据库契约读写","main":false,"details":{"when":"会话读取、保存和历史清理。","steps":["ConversationManager.get_conversation() 调 get_conversation_by_id()","new_conversation()/update_conversation() 调用 create_conversation()/update_conversation()","字段类型标注为 BaseDatabase；运行时实例由 SQLiteDatabase 提供"],"dataFlow":["ConversationManager → BaseDatabase API → SQLiteDatabase 实现"],"result":"会话 CRUD 与数据库后端隔离；当前部署使用 SQLiteDatabase。","sources":[["astrbot/core/db/__init__.py",129,223],["astrbot/core/conversation_mgr.py",1,160]]}},{"id":"e61","from":"Context","to":"SendMessageToUserTool","kind":"provides","label":"注册 Cron/主动发送工具","main":false,"details":{"when":"build_main_agent 根据主动任务/配置注入工具。","steps":["build_main_agent 根据平台能力从 FunctionToolManager 取得 SendMessageToUserTool","工具根据调用参数构造消息组件和目标会话","调用 Context.send_message() 或当前 event.send()"],"dataFlow":["ToolCall arguments → 消息组件 + 目标会话"],"result":"Agent 可向当前或获授权的其他会话发送消息。","sources":[["astrbot/core/tools/message_tools.py",76,190],["astrbot/core/star/context.py",665,748]],"conditions":"CronJobManager 只有 delivery_session_str 非空时显式加入该工具；build_main_agent 还可能按平台 support_proactive_message 能力追加。内置工具不走非内置 _PermissionGuardedTool，而在 call() 内自行检查跨会话管理员权限。目标必须对应真实可发送平台；Cron 虚拟 session 本身不能保证投递。"}},{"id":"e62","from":"InternalAgentSubStage","to":"build_main_agent","kind":"calls","label":"构建本地 Agent","main":true,"details":{"when":"内部 Agent 进入执行并取得会话锁后。","steps":["传入当前 event、plugin Context、更新后的 MainAgentBuildConfig 及可选 ProviderRequest","await build_main_agent(...)，返回 None 或 MainAgentBuildResult"],"dataFlow":["event + Context + config + 可选 req → MainAgentBuildResult"],"result":"失败或请求被拒绝时不启动本轮 Agent。","sources":[["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",221,325],["astrbot/core/astr_main_agent.py",1734,1780]]}},{"id":"e63","from":"build_main_agent","to":"MainAgentBuildResult","kind":"produces","label":"返回构建结果","main":true,"details":{"when":"请求和 Runner 构建完成时。","steps":["准备 ProviderRequest 和工具","创建 AstrAgentContext、ContextWrapper 与 ToolLoopAgentRunner","按 apply_reset 选择是否等待 reset","返回 MainAgentBuildResult"],"dataFlow":["runner + request + provider + 可选 reset_coro → MainAgentBuildResult"],"result":"调用方据此执行 Agent。","sources":[["astrbot/core/astr_main_agent.py",251,255],["astrbot/core/astr_main_agent.py",1880,1910],["astrbot/core/astr_main_agent.py",1998,2040]]}},{"id":"e64","from":"build_main_agent","to":"AstrAgentContext","kind":"creates","label":"组装 Agent 上下文","main":true,"details":{"when":"准备 Runner 及工具执行环境时。","steps":["以 plugin_context 和当前 event 创建 AstrAgentContext","再放入 AgentContextWrapper 供 Runner 和工具使用"],"dataFlow":["Context + AstrMessageEvent → AstrAgentContext"],"result":"通用 Agent 和工具可以访问本次事件及框架服务。","sources":[["astrbot/core/astr_main_agent.py",1890,1906],["astrbot/core/astr_agent_context.py",10,20]]}},{"id":"e65","from":"AstrAgentContext","to":"Context","kind":"owns","label":"持有插件服务上下文","main":false,"details":{"when":"创建 AstrAgentContext 时。","steps":["context 字段保存 plugin Context","工具通过它访问 Provider、会话、Cron、平台等服务"],"dataFlow":["AstrAgentContext.context → Context"],"result":"Agent 专用上下文与框架服务相连。","sources":[["astrbot/core/astr_agent_context.py",10,20],["astrbot/core/star/context.py",132,180]]}},{"id":"e66","from":"AstrAgentContext","to":"AstrMessageEvent","kind":"owns","label":"持有当前事件","main":false,"details":{"when":"创建 AstrAgentContext 时。","steps":["event 字段保存当前事件","工具可读取事件 UMO、extras 并按需要发送消息"],"dataFlow":["AstrAgentContext.event → AstrMessageEvent"],"result":"工具执行与本次消息事件关联。","sources":[["astrbot/core/astr_agent_context.py",10,20]]}},{"id":"e67","from":"ContextWrapper","to":"AstrAgentContext","kind":"wraps","label":"通用 Agent 包装","main":true,"details":{"when":"build_main_agent 调用 runner.reset 时。","steps":["ContextWrapper.context 保存 AstrAgentContext","messages 保存 Agent 消息列表，tool_call_timeout 控制工具等待"],"dataFlow":["AstrAgentContext → ContextWrapper[AstrAgentContext]"],"result":"Runner 使用通用包装；AstrBot 特定信息保留在内部。","sources":[["astrbot/core/agent/run_context.py",13,20],["astrbot/core/astr_main_agent.py",1998,2010]]}},{"id":"e68","from":"ToolLoopAgentRunner","to":"ContextWrapper","kind":"owns","label":"运行时上下文","main":true,"details":{"when":"Runner reset 后执行模型和工具时。","steps":["reset 保存 run_context","step 使用 run_context.messages 维护对话","工具执行时传入同一 run_context"],"dataFlow":["ContextWrapper.messages / context → Runner 和 FunctionToolExecutor"],"result":"同一轮 Agent 共享消息状态和 AstrBot 上下文。","sources":[["astrbot/core/agent/runners/tool_loop_agent_runner.py",210,290],["astrbot/core/agent/run_context.py",13,20]]}},{"id":"e69","from":"AiocqhttpAdapter","to":"AiocqhttpMessageEvent","kind":"creates","label":"create_event()","main":true,"details":{"when":"收到并转换 OneBot 消息之后。","steps":["create_event(message) 构造 AiocqhttpMessageEvent","注入 AstrBotMessage、平台元数据、session_id 和 CQHttp
