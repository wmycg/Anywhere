  .node{cursor:pointer;outline:none}.node rect.card{fill:#fff;stroke:#b8cbc8;stroke-width:1.2;filter:drop-shadow(0 2px 3px #163d3510)}.node:hover rect.card,.node:focus rect.card,.node.selected rect.card{stroke:#008c80;stroke-width:2.8}.node.dim{opacity:.16}.node .accent{stroke-width:4}.node .kind{font-size:10px;font-weight:700;fill:#62777c}.node .name{font-size:14px;font-weight:700;fill:#1d3238}.node .filetext{font-size:10px;fill:#60777c}.node .description{font-size:11px;fill:#4c6268}.node .count{font-size:10px;fill:#738a8b}.node.key rect.card{fill:#fff7eb;stroke:#be652e;stroke-width:2.6;filter:drop-shadow(0 2px 5px #81451b30)}.node.key .key-badge{font-size:10px;font-weight:700;fill:#a54d1f}.node.external rect.card{fill:#f2f7ff;stroke:#3a69a5;stroke-width:2;stroke-dasharray:6 3}.node.external .kind{fill:#315e96}.node.key.external rect.card{fill:#fff7eb}.node.key:hover rect.card,.node.key:focus rect.card,.node.key.selected rect.card,.node.external:hover rect.card,.node.external:focus rect.card,.node.external.selected rect.card{stroke:#008c80;stroke-width:3}
  @media(max-width:850px){.topbar{gap:8px;align-items:flex-start;flex-wrap:wrap;padding:9px 12px}.brand{min-width:0;width:100%}.brand small{display:none}.tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px;width:100%}.search{width:auto;min-width:0}.tools select{width:100%;min-width:0}.tool-button{width:100%;padding:0 5px}.layout{display:block;position:relative}.graph-wrap{height:100%}.panel{position:absolute;z-index:5;right:0;bottom:0;left:0;max-height:50%;border-left:0;border-top:1px solid #cddbd8;box-shadow:0 -5px 25px #1c343521;padding:15px 16px 24px;display:none}.panel.open{display:block}.panel .close-panel{display:block;border:0;background:#edf4f3;border-radius:4px;width:30px;height:30px;font-size:20px;color:#47615e}.panel h2{font-size:17px}.graph-hint{top:8px;left:8px}.graph-controls{bottom:10px;left:8px}.panel.open~.graph-controls{bottom:52%}}

<script>
const model = {"title":"AstrBot Core 类关系与数据流","subtitle":"每个类只出现一次；点击类查看定义，点击箭头查看调用、条件、数据包装和后续消费者。","revision":"dad255c60f7983fd63c7c0282ded1dde859fbc9a","repository":"https://github.com/wmycg/AstrBot","canvas":{"width":3210,"height":3440},"groups":[{"id":"runtime","label":"启动与运行时编排","x":40,"y":36,"w":320,"h":2600,"color":"#8b5cf6"},{"id":"platform","label":"平台输入与统一事件","x":390,"y":36,"w":320,"h":2600,"color":"#0ea5e9"},{"id":"routing","label":"配置路由与 Pipeline","x":740,"y":36,"w":320,"h":2600,"color":"#14b8a6"},{"id":"agent","label":"插件、上下文与 Agent","x":1090,"y":36,"w":320,"h":2600,"color":"#f59e0b"},{"id":"provider","label":"Provider 与请求模型","x":1440,"y":36,"w":320,"h":2600,"color":"#ef4444"},{"id":"tools","label":"Tool / MCP 执行链","x":1790,"y":36,"w":320,"h":2600,"color":"#8b5cf6"},{"id":"output","label":"结果、持久化与发送","x":2140,"y":36,"w":650,"h":2740,"color":"#22c55e"},{"id":"cron","label":"Cron 旁路入口","x":2840,"y":36,"w":320,"h":2600,"color":"#64748b"},{"id":"external","label":"外部系统与持久化边界","x":40,"y":2830,"w":3120,"h":560,"color":"#315e96"}],"nodes":[{"id":"InitialLoader","importance":"key","label":"InitialLoader","kind":"class","group":"runtime","x":70,"y":110,"summary":"进程级启动入口。构造 AstrBotCoreLifecycle，先 initialize，成功后再 start。","file":"astrbot/core/initial_loader.py","fields":["db","log_broker","webui_dir"],"methods":["start()"],"sources":[["astrbot/core/initial_loader.py",17,57]],"explanation":{"role":"启动 Core 和仪表板的进程级编排入口，持有已传入的数据库和日志代理。","logic":["start() 用日志代理和数据库构造 AstrBotCoreLifecycle，并先等待 initialize()；初始化异常会记录严重错误并返回。","初始化成功后建立 Core start 协程和 AstrBotDashboard；仪表板有可运行协程时用 asyncio.gather 并发运行，否则只等待 Core。","任务被取消时调用 core_lifecycle.stop() 进行关闭。"],"data":["db 与 log_broker 被传入生命周期对象；同一个 db 和生命周期对象也传给仪表板。webui_dir 作为可选的前端资源目录传入。"],"caveats":["这个类负责启动编排，不负责对单条消息进行转换或运行流水线。"],"sources":[["astrbot/core/initial_loader.py",17,57]]}},{"id":"AstrBotCoreLifecycle","importance":"key","label":"AstrBotCoreLifecycle","kind":"class","group":"runtime","x":70,"y":300,"summary":"Core 生命周期总编排者，持有配置、平台、Provider、插件、Cron、PipelineScheduler 映射和 EventBus。","file":"astrbot/core/core_lifecycle.py","fields":["astrbot_config_mgr","platform_manager","provider_manager","plugin_manager","pipeline_scheduler_mapping","event_bus"],"methods":["initialize()","start()","_load()","load_pipeline_scheduler()"],"sources":[["astrbot/core/core_lifecycle.py",51,80],["astrbot/core/core_lifecycle.py",157,295],["astrbot/core/core_lifecycle.py",296,379],["astrbot/core/core_lifecycle.py",460,474]],"explanation":{"role":"Core 的生命周期编排者，负责按依赖顺序准备配置、共享队列、平台、插件、模型与消息流水线，让它们持有需要的共同服务。它自身不是消息处理阶段。","logic":["initialize() 先初始化数据库和共享配置存储，再加载 UmopConfigRouter 与 AstrBotConfigManager，随后创建共享事件队列和平台、Provider、对话、Cron 等管理器。","它将管理器注入插件 Context，再构造 PluginManager、加载插件并初始化 Provider；load_pipeline_scheduler() 为每个已加载的配置档案构建 PipelineContext 和 PipelineScheduler，并初始化阶段。","它使用同一个队列、配置管理器和调度器映射创建 EventBus，随后让 PlatformManager 初始化平台适配器；PlatformManager 自身也负责启动平台任务。","start() 调用 _load() 启动 EventBus.dispatch()、Cron 等后台协程，并执行插件启动完成钩子。"],"data":["共享 event_queue 将平台入口与 EventBus 相连。pipeline_scheduler_mapping 的实际键是配置档案 ID，值是该档案对应的 PipelineScheduler。","PipelineContext 接受当前 AstrBotConfig、PluginManager、配置 ID 和数据库；这些对象会提供给流水线的各个 Stage。"],"caveats":["load_pipeline_scheduler() 的文档字符串把映射键称为平台 ID，但代码遍历的是 astrbot_config_mgr.confs 中的配置 ID；阅读运行逻辑时应以代码为准。","初始化与处理消息是不同阶段：初始化准备依赖，EventBus 和 PipelineScheduler 在随后收到事件时才处理具体消息。"],"sources":[["astrbot/core/core_lifecycle.py",157,187],["astrbot/core/core_lifecycle.py",207,280],["astrbot/core/core_lifecycle.py",288,303],["astrbot/core/core_lifecycle.py",357,375],["astrbot/core/core_lifecycle.py",460,474],["astrbot/core/platform/manager.py",118,134]]}},{"id":"AstrBotConfigManager","importance":"key","label":"AstrBotConfigManager","kind":"class","group":"runtime","x":70,"y":500,"summary":"管理多个配置档案，并把 UMO 映射成配置档案信息或实际 AstrBotConfig。EventBus 依赖它做第一跳路由。","file":"astrbot/core/astrbot_config_mgr.py","fields":["confs：profile ID 到配置对象","abconf_data：profile 元数据","ucr：UMO 模式路由","sp：持久化存储"],"methods":["get_conf_info(umo)：验证 UMO，经 ucr 找匹配配置，找不到返回 default","get_conf(umo)：获取 profile 配置","initialize()：加载元数据和配置"],"sources":[["astrbot/core/astrbot_config_mgr.py",32,80],["astrbot/core/astrbot_config_mgr.py",131,180],["astrbot/core/astrbot_config_mgr.py",191,267]],"explanation":{"role":"管理配置档案及其元数据，按统一消息来源 UMO 查询消息应该使用哪个配置；EventBus 借此选择对应的流水线。","logic":["initialize() 从 SharedPreferences 读取 abconf_mapping，再按照元数据中的路径加载存在的配置文件到 confs。","get_conf_info(umo) 调用 _load_conf_mapping()：先把 MessageSession 或字符串规范化并校验，再向 UmopConfigRouter 查询配置 ID，用该 ID 查档案元数据。","UMO 无效、没有匹配规则或元数据不存在时返回默认档案信息；get_conf() 则根据查询结果从 confs 取实际配置，缺失时回退默认配置。"],"data":["confs 保存配置 ID 到 AstrBotConfig 的映射；abconf_data 保存档案元数据；ucr 是保存和匹配 UMO 路由的 UmopConfigRouter。","get_conf_info 返回 ConfInfo 字典，包含 id、name、path；get_conf 返回的是实际 AstrBotConfig 对象。EventBus 使用前者的 id 找 PipelineScheduler。"],"caveats":["配置档案信息与配置内容是不同的数据：知道 ConfInfo 不等于已经拿到了实际配置对象。","初始化前访问档案元数据会引发 RuntimeError；配置文件不存在时会记录警告并跳过加载。"],"sources":[["astrbot/core/astrbot_config_mgr.py",17,29],["astrbot/core/astrbot_config_mgr.py",32,52],["astrbot/core/astrbot_config_mgr.py",72,129],["astrbot/core/astrbot_config_mgr.py",152,177],["astrbot/core/event_bus.py",61,73]]}},{"id":"UmopConfigRouter","label":"UmopConfigRouter","kind":"class","group":"runtime","x":70,"y":700,"summary":"保存 UMO 模式到配置 ID 的路由表，按 platform:type:session 三段匹配通配符。","file":"astrbot/core/umop_config_router.py","fields":["umop_to_conf_id：模式到配置 ID 的映射","sp：持久化存储"],"methods":["get_conf_id_for_umop(umo)：按顺序匹配 UMO 模式并返回首个配置 ID","update_route()：更新路由并持久化"],"sources":[["astrbot/core/umop_config_router.py",6,45],["astrbot/core/umop_config_router.py",47,90]],"explanation":{"role":"保存统一消息来源模式到配置档案 ID 的路由表，供 AstrBotConfigManager 查找会话使用的配置。","logic":["initialize() 从 SharedPreferences 读取全局 umop_config_routing。","get_conf_id_for_umop() 顺序检查路由表，使用 _is_umo_match() 逐段比较，返回第一个匹配的配置 ID；没有匹配返回 None。","update_routing_data() 校验并替换整个路由表；update_route() 更新一项；两者均写回共享存储。"],"data":["UMO 由平台 ID、消息类型、会话 ID 三段构成，_split_umo 最多分割两次以保留会话 ID 内的冒号；模式可用通配符，空段匹配任意值。"],"caveats":["结果是配置 ID 而不是 AstrBotConfig；匹配按现有字典顺序返回首个结果，不应假定自动选择最具体模式。"],"sources":[["astrbot/core/umop_config_router.py",6,26],["astrbot/core/umop_config_router.py",28,61],["astrbot/core/umop_config_router.py",63,100],["astrbot/core/astrbot_config_mgr.py",103,129]]}},{"id":"PlatformManager","label":"PlatformManager","kind":"class","group":"runtime","x":70,"y":900,"summary":"按平台配置动态导入具体 Adapter，启动 run 协程，并维护平台实例。","file":"astrbot/core/platform/manager.py","fields":["platform_insts","_platform_tasks","event_queue"],"methods":["initialize()","load_platform()","terminate_platform()"],"sources":[["astrbot/core/platform/manager.py",23,75],["astrbot/core/platform/manager.py",104,165]],"explanation":{"role":"加载、保存和管理 Platform 具体适配器及其运行任务，并把共享事件队列交给各平台实例。","logic":["initialize() 遍历平台配置，检查 webhook 配置并调用 load_platform()，随后额外构造 WebChatAdapter 并启动其任务。","load_platform() 跳过未启用的配置、检查平台 ID，按配置类型导入适配器，再通过 platform_cls_map 取得注册类并实例化。","实例加入列表和 ID 映射，_start_platform_task() 创建实际运行任务及包装任务；随后触发平台加载钩子。"],"data":["platform_insts 保存已加载的 Platform 实例；_inst_map 关联配置 ID 和实例；_platform_tasks 以 client_self_id 保存运行和包装任务；event_queue 被所有适配器共享。"],"caveats":["平台实例由具体注册类创建，不是直接实例化抽象 Platform；类型未知或导入失败时会记录错误，无法得到该适配器。"],"sources":[["astrbot/core/platform/manager.py",23,39],["astrbot/core/platform/manager.py",52,75],["astrbot/core/platform/manager.py",104,142],["astrbot/core/platform/manager.py",220,255]]}},{"id":"ProviderManager","label":"ProviderManager","kind":"class","group":"runtime","x":70,"y":1100,"summary":"加载和选择 Provider；按 profile、UMO 和 provider_id 返回当前会话使用的模型服务，同时异步启动 MCP 初始化。","file":"astrbot/core/provider/manager.py","fields":["provider_insts","default_chat_provider_id","curr_provider_inst","llm_tools"],"methods":["initialize()","get_using_provider_async()","_resolve_using_provider()","load_provider()"],"sources":[["astrbot/core/provider/manager.py",36,110],["astrbot/core/provider/manager.py",244,365],["astrbot/core/provider/manager.py",366,456]],"explanation":{"role":"管理和选择模型提供商实例，按聊天、语音识别、语音合成等类别维护可用服务，同时持有 FunctionToolManager。","logic":["initialize() 遍历配置并调用 load_provider()；每个实例加载失败会被记录，不一定阻断其余实例。随后根据保存的默认选择和实例列表确定当前对象。","load_provider() 合并来源配置，跳过禁用项，动态导入配置指定的适配器，并通过注册信息加载对应 Provider。","get_using_provider_async(type, umo) 先读取会话级 Provider 偏好，再由 _resolve_using_provider() 在实例映射、会话配置及可用列表之间回退。","初始化末尾通过后台任务调用 llm_tools.init_mcp_clients()；MCP 初始化与 Provider 实例加载不是同一个同步步骤。"],"data":["providers_config 提供实例配置；inst_map 用 ID 查对象；provider_insts 等列表保存不同类别的提供商；llm_tools 是 FunctionToolManager。"],"caveats":["找不到 Provider、功能被禁用或缺少可用实例时可能返回 None；不同 Provider 类型的回退规则并不完全相同。","后台启动 MCP 不表示 initialize() 返回时所有 MCP 服务均已连接成功。"],"sources":[["astrbot/core/provider/manager.py",36,98],["astrbot/core/provider/manager.py",244,315],["astrbot/core/provider/manager.py",342,370],["astrbot/core/provider/manager.py",444,454],["astrbot/core/provider/manager.py",712,759]]}},{"id":"PluginManager","label":"PluginManager","kind":"class","group":"runtime","x":70,"y":1300,"summary":"加载插件并触发注册；star_map 和 star_handlers_registry 是模块级注册表。","file":"astrbot/core/star/star_manager.py","fields":["context","config","failed_plugin_dict"],"methods":["reload()","load()"],"sources":[["astrbot/core/star/star_manager.py",193,280]],"explanation":{"role":"管理插件的发现、加载、重载及注册状态，并将应用服务上下文传递给插件实例。","logic":["构造时保存 Context 和 AstrBotConfig，设置插件目录、配置目录和内置插件目录，并将管理器引用写回 Context。","reload() 使用锁串行化操作，终止并解绑已加载插件或指定插件，再调用 load()。","load() 读取停用插件及工具等配置，发现插件模块并尝试导入、实例化插件类；加载成功的元数据登记到 star_map 和 star_registry。"],"data":["context 是提供各服务的插件 Context；star_registry 和 star_map 维护已注册插件元数据；star_handlers_registry 保存处理器注册信息。"],"caveats":["管理器负责插件生命周期与注册，不等同于直接处理每条消息；后续 WakingCheckStage 和 ProcessStage 等从注册信息中选择和调用处理器。","加载失败可能留下失败记录，清理流程会移除对应模块、插件元数据、处理器、工具与平台适配器注册。"],"sources":[["astrbot/core/star/star_manager.py",193,223],["astrbot/core/star/star_manager.py",776,819],["astrbot/core/star/star_manager.py",1018,1105],["astrbot/core/star/star_manager.py",1326,1373],["astrbot/core/pipeline/waking_check/stage.py",145,161],["astrbot/core/pipeline/process_stage/stage.py",43,60]]}},{"id":"CronJobManager","label":"CronJobManager","kind":"class","group":"runtime","x":70,"y":1500,"summary":"读取 CronJob，维护 basic/active_agent 任务状态；active_agent 任务旁路唤醒 Agent。","file":"astrbot/core/cron/manager.py","fields":["db：持久化 CronJob","scheduler：APScheduler","_running_tasks：运行 task 集合","ctx：启动时注入的 Context"],"methods":["start()：启动并从数据库恢复任务","_run_basic_job()：运行基础 handler","_run_active_agent_job()：触发主动 Agent","_woke_main_agent()：构造 CronMessageEvent 并调用 build_main_agent"],"sources":[["astrbot/core/cron/manager.py",103,154],["astrbot/core/cron/manager.py",369,426],["astrbot/core/cron/manager.py",437,596]],"explanation":{"role":"统一管理基础定时任务和主动 Agent 任务：保存定义、维护 APScheduler 调度并记录每次运行状态。","logic":["start 保存 Context、启动调度器并同步数据库中启用且可恢复的任务；基础任务缺少内存 handler 时会跳过恢复。","add_basic_job/add_active_job 先创建 CronJob 记录，再在启用时注册；_build_trigger 为单次任务构造 DateTrigger，为周期任务构造 CronTrigger。","_run_job 根据 job_type 分派到普通 handler 或主动 Agent 路径，记录 running/completed/failed/cancelled，并在完成后更新下次运行信息。","delete_job 移除调度，取消并等待已执行任务，再删除数据库记录。"],"data":["数据库 CronJob 保存任务配置和状态；_basic_handlers 是进程内的 job_id 到 handler 映射；_running_tasks 跟踪当前执行。"],"caveats":["普通任务 handler 存在于内存，不能仅靠数据库中的 payload 恢复可执行函数。","调度器 next_run_time 会异步写回数据库，需要立即读取实时值时应使用 get_next_run_time。","run_job_now 不会因为手动执行而删除单次任务。"],"sources":[["astrbot/core/cron/manager.py",103,154],["astrbot/core/cron/manager.py",156,212],["astrbot/core/cron/manager.py",231,258],["astrbot/core/cron/manager.py",267,343],["astrbot/core/cron/manager.py",351,435]]}},{"id":"ConversationManager","importance":"key","label":"ConversationManager","kind":"class","group":"runtime","x":70,"y":1700,"summary":"按会话读取和保存对话上下文；build_main_agent 会把它包装进 ProviderRequest。","file":"astrbot/core/conversation_mgr.py","fields":["db","save_interval"],"methods":["new_conversation()","get_conversation()","update_conversation()"],"sources":[["astrbot/core/conversation_mgr.py",1,160]],"explanation":{"role":"为统一消息来源管理当前对话 ID，并通过数据库读取和更新对应的模型对话历史。","logic":["new_conversation 根据 UMO 推断平台 ID，调用数据库创建记录，将 conversation_id 写入内存映射和 SharedPreferences 的 sel_conv_id。","get_curr_conversation_id 优先读取内存，缺失时再读取 SharedPreferences 并回填；switch_conversation 同步更新内存和持久化选择。","get_conversation 根据 ID 查询 ConversationV2；可选地在未找到时新建，最后转换成兼容 Conversation 返回。","update_conversation 更新对话内容及有关元数据；删除当前对话时同时清除当前选择。"],"data":["统一消息来源 UMO 用于定位当前选中对话；conversation_id 是具体对话 UUID，二者不是同一种标识。","数据库记录 content 为消息列表；兼容 Conversation.history 为 JSON 字符串。"],"caveats":["当前选中对话的映射和数据库里的全部对话记录是两层状态。","平台消息历史有单独的 PlatformMessageHistoryManager；不要把它当作此处模型上下文的同义词。"],"sources":[["astrbot/core/conversation_mgr.py",19,29],["astrbot/core/conversation_mgr.py",62,90],["astrbot/core/conversation_mgr.py",92,158],["astrbot/core/conversation_mgr.py",174,214],["astrbot/core/conversation_mgr.py",279,309]]}},{"id":"PlatformMessageHistoryManager","label":"PlatformMessageHistoryManager","kind":"class","group":"runtime","x":70,"y":1900,"summary":"保存平台消息历史；Agent 完成后和事件发送侧共同使用。","file":"astrbot/core/platform_message_history_mgr.py","fields":["db"],"methods":["insert_message_chain()","get()","update()"],"sources":[["astrbot/core/platform_message_history_mgr.py",7,165]],"explanation":{"role":"按平台实例与统一消息来源保存、读取平台消息历史，对上层隐藏具体数据库实现。","logic":["insert_message_chain 遍历 MessageChain，将 Plain 转为文本、At 和 Reply 转为带必要字段的字典，图片、语音、视频和文件等则转成文本占位标记。","有有效片段时通过 insert 委托数据库写入 content={'type': role, 'message': parts}；没有有效片段时返回 None。","get 委托数据库分页查询并反转列表；update、delete、count 等继续委托对应数据库方法。"],"data":["保存内容是平台无关、避免包含本地路径的表示；max_messages 可交由数据库限制保留条数。","部分操作可附带 sender_id、sender_name 和 llm_checkpoint_id。"],"caveats":["这里保存的平台历史与 ConversationV2.content 中的模型上下文属于不同记录与用途。","媒体在此路径中是类型占位，不是保存完整媒体文件；不能从占位内容还原原文件。"],"sources":[["astrbot/core/platform_message_history_mgr.py",7,32],["astrbot/core/platform_message_history_mgr.py",34,119],["astrbot/core/platform_message_history_mgr.py",121,165],["astrbot/core/db/po.py",246,278]]}},{"id":"Platform","label":"Platform","kind":"abstract","group":"platform","x":420,"y":100,"summary":"所有平台适配器的抽象契约。规定 run、create_event、commit_event、send_by_session 等边界。","file":"astrbot/core/platform/platform.py","fields":["config","_event_queue","status","client_self_id"],"methods":["run()","create_event()","commit_event()","send_by_session()","meta()"],"sources":[["astrbot/core/platform/platform.py",38,53],["astrbot/core/platform/platform.py",122,170]],"explanation":{"role":"平台适配器基类，提供消息平台运行契约和部分公共实现；它将平台入口与 Core 的事件队列连接起来。","logic":["构造时保存平台配置和共享 event_queue，并维护平台状态等信息。run() 和 meta() 是要求具体平台实现的抽象方法。","commit_event(event) 将 AstrMessageEvent 放入共享队列，之后由 EventBus 消费。基类 create_event(message) 也有默认实现，用消息、平台元数据和会话 ID 创建事件。","实际平台协议的接收、格式转换与发送需要查看具体适配器及其事件实现；例如 AiocqhttpAdapter 会覆盖 create_event()。"],"data":["输入的 AstrBotMessage 表示规范化后的消息；create_event 返回带处理状态及行为的 AstrMessageEvent。_event_queue 传递的是事件，不是原始平台协议数据。"],"caveats":["Platform 是抽象基类，但不是只有抽象方法：commit_event 和 create_event 都有具体实现。","基类 send_by_session() 中有指标上报，不能仅凭调用基类方法就认定消息已经通过平台协议发送。"],"sources":[["astrbot/core/platform/platform.py",38,49],["astrbot/core/platform/platform.py",121,165],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",492,510]]}},{"id":"AiocqhttpAdapter","importance":"key","label":"AiocqhttpAdapter","kind":"class","group":"platform","x":420,"y":300,"summary":"OneBot 代表实现：把原生事件和消息段转换成 AstrBot 统一模型，再提交到共享队列。","file":"astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py","fields":["bot","config","metadata","settings"],"methods":["run()","convert_message()","_convert_handle_message_event()","create_event()","handle_msg()"],"sources":[["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",35,45],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",128,141],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",198,252],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",427,510]],"explanation":{"role":"OneBot v11 的一个具体平台适配器。它接收 aiocqhttp 的平台事件，将其转换成 Core 可以处理的消息和事件，再投递到共享队列。","logic":["初始化 CQHttp 客户端，并分别注册 request、notice、group 和 private 回调；回调先调用 convert_message()。","convert_message() 按 post_type 分发给消息、通知或请求的转换方法，产出 AstrBotMessage；某些输入会返回 None 而不继续处理。","handle_msg() 调用本类 create_event()，将 AstrBotMessage、平台元数据、session_id 和 bot 包装成 AiocqhttpMessageEvent，然后通过继承的 commit_event() 投递。"],"data":["OneBot Event → AstrBotMessage → AiocqhttpMessageEvent → 共享队列。原始平台事件和 Core 事件不是同一个对象；bot 客户端也被注入具体事件用于平台相关操作。"],"caveats":["这里是具体适配器示例，其他平台可使用不同的接入和转换方式；不能把这一实现等同于 Platform 基类的全部行为。","回调捕获并记录转换或处理异常，因此失败时可能不会产生进入队列的事件。"],"sources":[["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",35,102],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",128,141],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",492,510],["astrbot/core/platform/platform.py",147,149]]}},{"id":"WebChatAdapter","label":"WebChatAdapter","kind":"class","group":"platform","x":420,"y":500,"summary":"WebChat 代表实现；除消息文本外，还把 provider/model/action 等请求级信息放入 event extras。","file":"astrbot/core/platform/sources/webchat/webchat_adapter.py","fields":["_webchat_queue_mgr","config","metadata"],"methods":["convert_message()","create_event()","handle_msg()","run()"],"sources":[["astrbot/core/platform/sources/webchat/webchat_adapter.py",62,110],["astrbot/core/platform/sources/webchat/webchat_adapter.py",204,285]],"explanation":{"role":"将 WebChat 输入队列中的请求转换为统一消息事件，接入与其他平台相同的 Core 流水线。","logic":["run() 创建 QueueListener，由它在 WebChatQueueMgr 上注册异步 callback。","callback 将 (username, cid, payload) 交给 convert_message()，解析消息段并构造 AstrBotMessage，再调用 handle_msg()。","create_event() 包装为 WebChatMessageEvent，并把 locale、请求标记、选择的 Provider/模型等可用请求信息放入事件 extras，最后由 commit_event() 投递。"],"data":["输入是用户名、会话标识和请求 payload 元组；输出依次是 AstrBotMessage、WebChatMessageEvent，最终进入共享事件队列。session_id 构造成 webchat!用户名!cid。"],"caveats":["WebChat 的请求监听由 QueueListener 和 WebChatQueueMgr 协作，不是 OneBot 网络回调；具体回复走 WebChatMessageEvent。"],"sources":[["astrbot/core/platform/sources/webchat/webchat_adapter.py",41,84],["astrbot/core/platform/sources/webchat/webchat_adapter.py",162,202],["astrbot/core/platform/sources/webchat/webchat_adapter.py",204,234],["astrbot/core/platform/sources/webchat/webchat_adapter.py",239,285]]}},{"id":"AstrBotMessage","label":"AstrBotMessage","kind":"record","group":"platform","x":420,"y":700,"summary":"平台无关的原始消息包装，保存消息类型、会话、发送者、群组、组件列表、文本和 raw_message。","file":"astrbot/core/platform/astrbot_message.py","fields":["type/self_id/session_id/message_id：消息类型、机器人、会话及消息 ID","sender/group：统一发送者和群信息","message：BaseMessageComponent 列表","message_str/raw_message/timestamp：文本、原始消息及时间戳"],"methods":["group_id：兼容属性，读取或更新 Group.group_id"],"sources":[["astrbot/core/platform/astrbot_message.py",10,84]],"explanation":{"role":"跨平台规范化的输入消息数据对象，保存发送者、会话、消息组件、纯文本和原始平台消息。","logic":["具体适配器将原始输入转换成 AstrBotMessage；随后平台 create_event() 将它作为 message_obj 包入 AstrMessageEvent 子类。","group_id 属性从 group 中读取群 ID；设置非空 ID 时必要时创建 Group，清空时将 group 设为 None。"],"data":["message 是 BaseMessageComponent 列表，message_str 是纯文本表示；sender 是 MessageMember，group 可为 Group 或 None，raw_message 保存平台原始数据。","type、self_id、session_id、message_id 和 timestamp 描述消息来源与身份。"],"caveats":["构造方法只初始化 timestamp 和 group 等少数字段，其他带类型注解的字段需要创建者赋值；消息对象不等同于承载处理状态的 AstrMessageEvent。"],"sources":[["astrbot/core/platform/astrbot_message.py",53,92],["astrbot/core/platform/sources/webchat/webchat_adapter.py",204,226],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",492,510]]}},{"id":"MessageMember","label":"MessageMember","kind":"record","group":"platform","x":420,"y":880,"summary":"统一发送者模型，供 AstrBotMessage 和 AstrMessageEvent 查询用户标识与名称。","file":"astrbot/core/platform/astrbot_message.py","fields":["user_id：发送者 ID","nickname：昵称"],"methods":[],"sources":[["astrbot/core/platform/astrbot_message.py",10,22]],"explanation":{"role":"消息发送者或群成员的轻量数据模型，保存 user_id 和可选 nickname。","logic":["适配器创建 AstrBotMessage 时可以用此对象填充 sender；Group 也可包含 MessageMember 列表。"],"data":["user_id 是成员标识；nickname 可以缺失。"],"caveats":["它描述成员数据，不负责鉴权或判断管理员；事件 role 在其他处理阶段设置。"],"sources":[["astrbot/core/platform/astrbot_message.py",9,18],["astrbot/core/platform/astrbot_message.py",22,35],["astrbot/core/platform/sources/webchat/webchat_adapter.py",204,211],["astrbot/core/pipeline/waking_check/stage.py",75,89]]}},{"id":"Group","label":"Group","kind":"record","group":"platform","x":420,"y":1040,"summary":"统一群组模型，携带 group_id、group_name 和管理员等群上下文。","file":"astrbot/core/platform/astrbot_message.py","fields":["group_id/group_name：群标识和名称","group_owner/group_admins：群主和管理员","members/member_count：成员信息"],"methods":[],"sources":[["astrbot/core/platform/astrbot_message.py",23,51]],"explanation":{"role":"群组元数据模型，作为 AstrBotMessage 的可选 group 保存群相关信息。","logic":["适配器可为消息构造 Group；AstrBotMessage.group_id 属性代理 group.group_id，必要时会创建或清除 Group。"],"data":["包括 group_id、可选群名称、头像、群主、管理员列表、成员列表及 member_count。members 中的成员为 MessageMember。"],"caveats":["member_count 可在成员列表不完整时提供总数，因此不能直接假设它等于 members 的长度。"],"sources":[["astrbot/core/platform/astrbot_message.py",22,37],["astrbot/core/platform/astrbot_message.py",60,61],["astrbot/core/platform/astrbot_message.py",74,92]]}},{"id":"PlatformMetadata","label":"PlatformMetadata","kind":"record","group":"platform","x":420,"y":1200,"summary":"平台能力和身份描述；事件创建和 RespondStage 的发送能力判断都依赖它。","file":"astrbot/core/platform/platform_metadata.py","fields":["name/id/description：平台类型、实例 ID 和描述","support_streaming_message/support_proactive_message：能力标记","default_config_tmpl/config_metadata：平台配置元信息"],"methods":[],"sources":[["astrbot/core/platform/platform_metadata.py",4,37]],"explanation":{"role":"描述平台适配器身份、展示信息及能力的元数据对象，作为统一事件的一部分传递给 Core。","logic":["具体适配器构建元数据并通过 meta() 提供；创建事件时将其传给 AstrMessageEvent。"],"data":["name 表示平台类型，如 aiocqhttp；id 是具体平台实例的唯一标识。其余字段包括展示名称、默认配置、是否支持流式或主动消息。"],"caveats":["平台类型 name 与实例 id 是两个概念，同一类平台可以有不同实例；UMO 使用的是实例标识。"],"sources":[["astrbot/core/platform/platform_metadata.py",4,26],["astrbot/core/platform/sources/aiocqhttp/aiocqhttp_platform_adapter.py",48,53],["astrbot/core/platform/astr_message_event.py",80,92],["astrbot/core/platform/astr_message_event.py",112,116]]}},{"id":"AstrMessageEvent","importance":"key","label":"AstrMessageEvent","kind":"abstract","group":"platform","x":420,"y":1380,"summary":"事件阶段间共享的状态容器：统一消息、会话、平台元数据、extras、result、trace、停止标志和发送接口。","file":"astrbot/core/platform/astr_message_event.py","fields":["message_obj：平台无关 AstrBotMessage","session：MessageSession，可编码为 unified_msg_origin","platform_meta：平台身份与能力","_extras：跨阶段共享扩展数据","_result：MessageEventResult","_force_stopped/trace：传播停止标记与执行跟踪"],"methods":["set_extra()/get_extra()：插件和 Stage 传递扩展状态","set_result()/get_result()：设置或读取结果","stop_event()/is_stopped()：控制传播","send()/send_streaming()：具体平台事件子类负责发送协议转换"],"sources":[["astrbot/core/platform/astr_message_event.py",79,175],["astrbot/core/platform/astr_message_event.py",273,283],["astrbot/core/platform/astr_message_event.py",370,440],["astrbot/core/platform/astr_message_event.py",534,564]],"explanation":{"role":"跨平台统一的消息事件对象。它把规范化消息与平台、会话、处理状态、结果及追踪信息组合起来，并为后续阶段和插件提供操作接口。","logic":["构造时保存 message_str、AstrBotMessage 与平台元数据，将消息类型转换成 MessageType，创建 MessageSession 和 TraceSpan。","unified_msg_origin 根据当前 session 生成统一来源字符串；session_id 属性读写 session 中的会话 ID，因此会话隔离修改的是事件的会话状态。","处理阶段或插件可以调用 set_result() 设置结果，传入字符串时会包装成 MessageEventResult；stop_event()、continue_event() 和 is_stopped() 控制传播。"],"data":["message_obj 是输入消息内容和结构；session 描述来源；_extras 保存扩展数据；_result 保存处理结果；trace 记录处理过程。","EventBus 先读取 unified_msg_origin 选择配置，之后可能修改 session_id；同一个事件随后传给 PipelineScheduler。"],"caveats":["AstrBotMessage 与 AstrMessageEvent 的职责不同：前者描述消息，后者在消息上承载处理状态和事件操作。","_force_stopped 独立于 _result；不能因为清除结果就推断事件一定恢复传播。基类是抽象基类，实际平台发送行为需看具体事件实现。"],"sources":[["astrbot/core/platform/astr_message_event.py",79,130],["astrbot/core/platform/astr_message_event.py",156,175],["astrbot/core/platform/astr_message_event.py",370,421],["astrbot/core/event_bus.py",55,75],["astrbot/core/event_bus.py",104,124]]}},{"id":"MessageSession","label":"MessageSession","kind":"record","group":"platform","x":420,"y":1580,"summary":"把 platform_id、message_type、session_id 编码成 unified_msg_origin，作为配置路由和持久会话键。","file":"astrbot/core/platform/message_session.py","fields":["platform_name/platform_id：平台适配器实例 ID（兼容名称，platform_id 派生）","message_type：消息类型","session_id：会话标识"],"methods":["__str__()：编码为 platform_id:message_type:session_id","from_str()：解析 UMO"],"sources":[["astrbot/core/platform/message_session.py",7,30]],"explanation":{"role":"标识消息会话的数据对象，用于构造统一消息来源 UMO 并在配置路由、会话管理等场景传递。","logic":["构造后 __post_init__ 将 platform_id 设为 platform_name；__str__ 生成 platform_id:message_type:session_id。","from_str() 最多按两个冒号拆分，并把第二段解析为 MessageType 后构造 MessageSession。"],"data":["platform_name 字段实际保存平台实例 ID；message_type 是 MessageType；session_id 标识具体会话。"],"caveats":["虽然字段名为 platform_name，其文档说明它实际是 platform_id；session_id 中的冒号会保留。MessageSesion 是兼容旧名称的别名。"],"sources":[["astrbot/core/platform/message_session.py",6,30],["astrbot/core/platform/astr_message_event.py",112,116],["astrbot/core/platform/astr_message_event.py",156,175]]}},{"id":"CronMessageEvent","label":"CronMessageEvent","kind":"class","group":"platform","x":420,"y":1800,"summary":"Cron 合成事件，继承 AstrMessageEvent；由 CronJobManager 直接驱动 Agent，不经过 EventBus/Pipeline。最终文本不会自动发送，主动送达依赖工具或显式 send。","file":"astrbot/core/cron/events.py","fields":["session：原始持久 MessageSession","context_obj：插件 Context","message_obj：合成的 AstrBotMessage"],"methods":["__init__()：构造模拟消息事件和唤醒状态","send()/send_streaming()：经 Context.send_message 发送"],"sources":[["astrbot/core/cron/events.py",17,74]],"explanation":{"role":"定时任务主动唤醒 Agent 时构造的合成消息事件。它继承 AstrMessageEvent，使后续构建 Agent 的代码可复用统一事件接口。","logic":["构造时根据 MessageSession 创建 PlatformMetadata 和 AstrBotMessage：将 note 文本包装为 Plain 消息组件，并生成消息 ID、发送者及时间戳。","父类初始化后保存原 session 与 Context，设置唤醒状态，并把定时任务 extras 合并进事件。","显式调用 send 时通过 Context.send_message(session, chain) 找到目标平台；send_streaming 逐个消费片段并调用 send。"],"data":["传入的 MessageSession 确定会话；AstrBotMessage 是内部合成的消息对象；extras 可携带 cron_job 和 cron_payload。"],"caveats":["它不是平台发来的原生事件；定时任务在 CronJobManager 中直接构建 Agent，不能假定先经过 EventBus 和完整 Pipeline。","调用 Agent 后产生最终文本不必然自动发送给目标会话；需要实际发送路径。","无配置投递 session 时可能使用 cron 虚拟会话，具体发送能否成功取决于 Context 是否找到对应平台。"],"sources":[["astrbot/core/cron/events.py",17,74],["astrbot/core/cron/manager.py",437,471],["astrbot/core/cron/manager.py",473,529],["astrbot/core/star/context.py",665,696]]}},{"id":"EventBus","importance":"key","label":"EventBus","kind":"class","group":"routing","x":770,"y":100,"summary":"从共享 asyncio.Queue 消费 AstrMessageEvent，先通过 UMO 查配置档案，再把事件交给对应 PipelineScheduler。","file":"astrbot/core/event_bus.py","fields":["event_queue：平台共享事件队列","pipeline_scheduler_mapping：profile ID 到 Scheduler","astrbot_config_mgr：通过 UMO 选配置","_pending_tasks：执行中的 task 与事件","stopped_platforms：停止平台集合"],"methods":["dispatch()：取事件→按原始 UMO 取 ConfInfo→选 Scheduler→应用会话隔离→创建执行 task","_apply_session_isolation()：按已选择配置修改群聊会话","stop_platform()：拦截队列并取消目标平台的运行任务"],"sources":[["astrbot/core/event_bus.py",38,75],["astrbot/core/event_bus.py",104,124]],"explanation":{"role":"Core 的事件消费与分发入口：从共享异步队列接收 AstrMessageEvent，根据事件来源选择配置档案和对应的 PipelineScheduler，并为其创建执行任务。","logic":["dispatch() 循环等待 event_queue.get()；如果事件所属平台已停止，记录取消并跳过。","它用当前事件的 unified_msg_origin 调 AstrBotConfigManager.get_conf_info()，取返回的 ConfInfo.id，从 pipeline_scheduler_mapping 选择调度器；没有对应调度器时记录错误并忽略事件。","选定调度器后，_apply_session_isolation() 根据该调度器上下文中的配置处理群聊会话隔离，再通过 asyncio.create_task(scheduler.execute(event)) 启动流水线。","任务保存在 _pending_tasks 中保持强引用，完成回调用于清理并记录未捕获异常；stop_platform() 还会处理该平台已排队或正在运行的事件。"],"data":["输入：平台提交的 AstrMessageEvent；配置路由中间结果：ConfInfo 字典；下游：选中的 PipelineScheduler 和同一个事件对象。","event_queue 是跨平台共享队列；pipeline_scheduler_mapping 按配置档案 ID 而不是平台类型索引；stopped_platforms 记录已停止的平台 ID。"],"caveats":["配置档案由隔离前的 UMO 决定，之后会话隔离才可能修改 session_id；不能将这两个先后步骤倒置。","dispatch 创建异步任务后继续取队列，不会等待当前消息的流水线完整结束才接收下一条。"],"sources":[["astrbot/core/event_bus.py",38,75],["astrbot/core/event_bus.py",77,133],["astrbot/core/astrbot_config_mgr.py",103,129],["astrbot/core/core_lifecycle.py",460,474]]}},{"id":"PipelineContext","label":"PipelineContext","kind":"record","group":"routing","x":770,"y":300,"summary":"每个配置档案对应的 Stage 共享服务边界，保存 AstrBotConfig、PluginManager、conf_id 和数据库。","file":"astrbot/core/pipeline/context.py","fields":["astrbot_config：profile 配置","plugin_manager：插件服务","astrbot_config_id：profile ID","db_helper：数据库访问","call_handler/call_event_hook：调用门面"],"methods":[],"sources":[["astrbot/core/pipeline/context.py",16,24]],"explanation":{"role":"一个配置档案对应的流水线共享依赖容器。Stage 初始化时从它读取配置和服务；它本身不是单条消息的事件。","logic":["AstrBotCoreLifecycle.load_pipeline_scheduler() 遍历已加载的配置档案，为每个配置创建 PipelineContext，并将它传入对应的 PipelineScheduler。","PipelineScheduler.initialize() 构建各个 Stage，并将同一个上下文交给各阶段的 initialize()。"],"data":["astrbot_config 是当前档案的 AstrBotConfig；plugin_manager 提供插件管理；astrbot_config_id 标识档案；db_helper 可选地提供数据库访问。","call_handler 和 call_event_hook 暴露管道上下文工具函数，用于调用处理器和事件钩子。"],"caveats":["不要把它与 AstrMessageEvent 混为一谈：前者是多个阶段共享的依赖，后者是某次消息处理的输入和状态。","它也不同于提供插件服务的 star.context.Context；两种 Context 的作用域和成员不同。"],"sources":[["astrbot/core/pipeline/context.py",15,24],["astrbot/core/core_lifecycle.py",460,474],["astrbot/core/pipeline/scheduler.py",23,36]]}},{"id":"PipelineScheduler","importance":"key","label":"PipelineScheduler","kind":"class","group":"routing","x":770,"y":500,"summary":"初始化并按 STAGES_ORDER 执行 Stage；异步生成器阶段形成洋葱模型，stop_event 会截断后续阶段。","file":"astrbot/core/pipeline/scheduler.py","fields":["ctx：profile 对应的 PipelineContext","stages：按 STAGES_ORDER 排序的实例"],"methods":["initialize()：初始化所有注册 Stage","execute(event)：建立事件和跟踪上下文并调度","_process_stages()：顺序调用 Stage；异步生成器 yield 时递归执行下游并恢复回程"],"sources":[["astrbot/core/pipeline/scheduler.py",20,36],["astrbot/core/pipeline/scheduler.py",38,102]],"explanation":{"role":"按配置档案调度消息处理阶段。它创建并持有 Stage 实例，接收 EventBus 转交的事件，并按阶段顺序推进处理。","logic":["构造时确保内置 Stage 已注册，将 registered_stages 按 STAGES_ORDER 排序；initialize() 创建阶段实例，并向每个阶段传入 PipelineContext。","execute(event) 建立日志、当前事件和 trace 上下文，再调用 _process_stages(event)。","如果某阶段 process 返回普通协程，调度器等待它结束并继续循环；如果返回异步生成器，则在每次 yield 暂停点递归执行后续阶段，再返回当前生成器继续后置处理。","在处理过程中若 event.is_stopped() 为真，则中断相应传播；WebChat 和 WecomAI 的事件在处理结束后还会发送 None 结束帧。"],"data":["ctx 保存该配置档案的 PipelineContext；stages 是初始化后的 Stage 实例列表；execute 接收的是 AstrMessageEvent，阶段通过修改事件及其结果来交接状态。"],"caveats":["异步生成器的 yield 将前置和后置处理分开，形成洋葱式调用；不能把所有阶段理解为只会从上到下执行一次的普通函数列表。","阶段处理可以改变事件并停止传播，图中的完整主链不代表每条事件都会执行到末尾。"],"sources":[["astrbot/core/pipeline/scheduler.py",20,36],["astrbot/core/pipeline/scheduler.py",38,82],["astrbot/core/pipeline/scheduler.py",84,102],["astrbot/core/pipeline/stage_order.py",3,13]]}},{"id":"Stage","label":"Stage","kind":"abstract","group":"routing","x":770,"y":700,"summary":"Pipeline 阶段抽象契约，定义 initialize(ctx) 和 process(event)；具体子类决定是否保存 ctx。","file":"astrbot/core/pipeline/stage.py","fields":[],"methods":["initialize(ctx)：接收 PipelineContext","process(event)：处理共享事件；yield 可暂停并让下游先执行"],"sources":[["astrbot/core/pipeline/stage.py",19,42]],"explanation":{"role":"Pipeline 阶段的抽象接口；每个具体 Stage 负责消息处理中的一段工作，由 PipelineScheduler 创建和调度。","logic":["register_stage 装饰器将具体类添加到 registered_stages。","具体类实现 initialize(ctx) 接收 PipelineContext，并实现 process(event) 处理 AstrMessageEvent；PipelineScheduler 按 STAGES_ORDER 排序并调用。"],"data":["initialize 接收阶段共享依赖；process 接收同一个事件对象，可以返回普通协程结果或异步生成器，并通过事件状态或结果影响下游。"],"caveats":["Stage.process 的文档对返回 None 的描述不能代替调度器真实控制逻辑：实际代码等待普通协程后继续循环，事件停止还需检查 event.is_stopped()。","异步生成器 yield 时调度器会递归执行后续阶段并再恢复当前生成器。"],"sources":[["astrbot/core/pipeline/stage.py",10,45],["astrbot/core/pipeline/scheduler.py",23,36],["astrbot/core/pipeline/scheduler.py",38,82],["astrbot/core/pipeline/stage_order.py",3,13]]}},{"id":"WakingCheckStage","label":"WakingCheckStage","kind":"class","group":"routing","x":770,"y":880,"summary":"识别唤醒词、@机器人、私聊和引用；筛选插件 handler，并写入 event.extras。","file":"astrbot/core/pipeline/waking_check/stage.py","fields":["ctx"],"methods":["process(event)"],"sources":[["astrbot/core/pipeline/waking_check/stage.py",63,115],["astrbot/core/pipeline/waking_check/stage.py",145,205]],"explanation":{"role":"判断输入是否唤醒机器人，同时确定用户角色和可激活的插件处理器，为后续处理准备事件状态。","logic":["initialize() 读取唤醒、权限、是否忽略机器人自身消息等设置。","process() 可忽略自身消息、设置管理员身份，根据唤醒前缀、@、引用及私聊规则更新 is_wake 和 is_at_or_wake_command，并处理前缀。","它遍历插件处理器及其过滤器，按插件集和权限等条件收集可激活处理器；过滤异常或权限失败的特定分支会回复并停止事件。"],"data":["消费 AstrMessageEvent 的文本、消息组件、发送者和平台配置，改变 event.role、event.message_str、event.is_wake 等状态，并为后续插件处理准备匹配结果。"],"caveats":["is_wake 与 is_at_or_wake_command 不完全等价：插件过滤器命中也能使事件唤醒，不能据此推断一定有 @ 或唤醒词。"],"sources":[["astrbot/core/pipeline/waking_check/stage.py",20,61],["astrbot/core/pipeline/waking_check/stage.py",63,144],["astrbot/core/pipeline/waking_check/stage.py",145,235],["astrbot/core/platform/astr_message_event.py",93,98]]}},{"id":"WhitelistCheckStage","label":"WhitelistCheckStage","kind":"class","group":"routing","x":770,"y":1040,"summary":"读取 profile 白名单和管理员例外，拒绝时 stop_event。","file":"astrbot/core/pipeline/whitelist_check/stage.py","fields":["ctx"],"methods":["process(event)"],"sources":[["astrbot/core/pipeline/whitelist_check/stage.py",15,71]],"explanation":{"role":"按配置对会话进行白名单检查，必要时停止消息事件传播。","logic":["initialize() 读取开关、白名单、管理员豁免和日志设置，并清理白名单文本。","process() 在未启用、列表为空或 WebChat 来源时直接跳过检查；按群聊/私聊管理员豁免规则也可能跳过。","事件 UMO 与群 ID 都不在白名单时调用 event.stop_event()，可按配置记录日志。"],"data":["检查 event.unified_msg_origin、群 ID、消息类型和 role；配置中的白名单作为匹配依据。"],"caveats":["列表为空表示不检查，不是阻止所有消息；WebChat 在此阶段被明确豁免。"],"sources":[["astrbot/core/pipeline/whitelist_check/stage.py",11,71]]}},{"id":"SessionStatusCheckStage","label":"SessionStatusCheckStage","kind":"class","group":"routing","x":770,"y":1200,"summary":"检查会话是否启用；关闭时补建 Conversation 并停止传播。","file":"astrbot/core/pipeline/session_status_check/stage.py","fields":["ctx","conv_mgr"],"methods":["initialize()","process(event)"],"sources":[["astrbot/core/pipeline/session_status_check/stage.py",12,40]],"explanation":{"role":"检查当前会话整体是否启用；禁用时阻止事件继续经过后续处理。","logic":["initialize() 从插件 Context 取得 ConversationManager。","process() 调用 SessionServiceManager.is_session_enabled(event.unified_msg_origin)；若会话禁用，则在需要时补建当前会话记录，随后 stop_event()。"],"data":["输入为事件的 UMO 和平台 ID；可能读取或创建对应对话记录，最终修改事件传播状态。"],"caveats":["禁用会话和配置档案选择是不同判断；这里通过会话服务状态决定是否继续。"],"sources":[["astrbot/core/pipeline/session_status_check/stage.py",11,40]]}},{"id":"RateLimitStage","label":"RateLimitStage","kind":"class","group":"routing","x":770,"y":1360,"summary":"按 UMO 做并发限流，满额时 stall 等待或 discard 丢弃。","file":"astrbot/core/pipeline/rate_limit_check/stage.py","fields":["locks","event_timestamps","rate_limit_count","rate_limit_time","rl_strategy"],"methods":["initialize()","process(event)"],"sources":[["astrbot/core/pipeline/rate_limit_check/stage.py",15,95]],"explanation":{"role":"按会话限制消息处理频率，超限时依据配置暂停或丢弃当前事件。","logic":["initialize() 加载次数、时间窗口和 stall/discard 策略。","process() 以 UMO 为键取得会话锁和时间戳队列，清理窗口外记录；未超限时追加当前时间。","超限时 stall 策略等待后再次检查；discard 策略调用 event.stop_event()。"],"data":["event_timestamps 是 UMO 到时间戳队列的映射；locks 为同一 UMO 的并发修改提供锁。"],"caveats":["rate_limit_count 不大于零时直接返回；超限不一定丢弃，还可能等待。"],"sources":[["astrbot/core/pipeline/rate_limit_check/stage.py",15,41],["astrbot/core/pipeline/rate_limit_check/stage.py",43,108]]}},{"id":"ContentSafetyCheckStage","label":"ContentSafetyCheckStage","kind":"class","group":"routing","x":770,"y":1520,"summary":"把当前文本和引用文本交给策略选择器检查，拒绝时写阻断结果并停止。","file":"astrbot/core/pipeline/content_safety_check/stage.py","fields":["strategy_selector"],"methods":["initialize()","process(event)"],"sources":[["astrbot/core/pipeline/content_safety_check/stage.py",15,56]],"explanation":{"role":"对输入或显式提供的回复文本执行配置驱动的内容安全检查。","logic":["initialize() 使用 content_safety 配置构造 StrategySelector。","未显式传 check_text 时，process() 汇总事件文本及引用消息中可提取的文本；否则检查给定文本。","策略拒绝时，若事件通过 @ 或唤醒命令触发，会设置阻止提示并 yield；随后停止事件并记录原因。"],"data":["输入文本经拼接后交给 strategy_selector.check()，返回是否通过及说明；结果可写入 MessageEventResult 并影响事件传播。"],"caveats":["当前类注释说明只检查文本；调用方 ResultDecorateStage 也会在符合配置时将回复文本交给此阶段检查。"],"sources":[["astrbot/core/pipeline/content_safety_check/stage.py",14,56],["astrbot/core/pipeline/result_decorate/stage.py",139,156]]}},{"id":"PreProcessStage","label":"PreProcessStage","kind":"class","group":"routing","x":770,"y":1680,"summary":"处理附件、路径、引用和临时文件，把平台差异压缩成后续 Agent 可消费的 event 状态。","file":"astrbot/core/pipeline/preprocess_stage/stage.py","fields":["ctx","config","plugin_manager","stt_settings","platform_settings"],"methods":["initialize()","process(event)"],"sources":[["astrbot/core/pipeline/preprocess_stage/stage.py",25,145]],"explanation":{"role":"在插件和 Agent 处理前整理事件消息及媒体，使下游更容易使用统一的文件路径和内容。","logic":["initialize() 获取当前配置、插件管理器及语音和平台设置。","process() 可按配置发送预响应表情，对图片和语音消息段执行路径映射；随后尝试将语音转换为 WAV、将图片转换并验证为本地文件。","引用消息中的媒体组件也会进入相关处理；媒体转换失败时记录警告。"],"data":["输入是事件消息链中的 Image、Record、Reply 等组件；处理可更新组件的 url、file 或 path，并追踪属于事件的临时文件。"],"caveats":["并非所有平台或事件都发送预响应表情；是否执行取决于平台、配置和事件唤醒状态。","此阶段处理媒体不意味着已经生成模型请求，后续 Agent 请求构造还会进一步包装数据。"],"sources":[["astrbot/core/pipeline/preprocess_stage/stage.py",24,32],["astrbot/core/pipeline/preprocess_stage/stage.py",34,49],["astrbot/core/pipeline/preprocess_stage/stage.py",65,97],["astrbot/core/pipeline/preprocess_stage/stage.py",99,200]]}},{"id":"ProcessStage","importance":"key","label":"ProcessStage","kind":"class","group":"agent","x":1120,"y":100,"summary":"Pipeline 的分流中心：先处理 SessionWaiter，再运行插件 handler，最后决定是否进入默认 Agent。","file":"astrbot/core/pipeline/process_stage/stage.py","fields":["ctx","config","plugin_manager","agent_sub_stage","star_request_sub_stage"],"methods":["initialize()","process(event)"],"sources":[["astrbot/core/pipeline/process_stage/stage.py",14,76]],"explanation":{"role":"Pipeline 中处理插件和 Agent 请求的分流阶段；它连接会话等待器、插件 handler 与默认 LLM 路径。","logic":["initialize() 创建并初始化 AgentRequestSubStage 和 StarRequestSubStage。","process() 先检查会话等待器过滤器，命中未完成的等待会话时触发等待器并停止事件。","读取 activated_handlers，逐个委托插件子阶段；插件产生 ProviderRequest 时把它放入 event.extra 并调用 Agent 子阶段。","之后仅在 AI 启用、事件满足唤醒且尚未执行发送等条件下进入默认 Agent 分支。"],"data":["输入为 AstrMessageEvent；插件请求通过 event.extra.provider_request 传给后续 Agent；处理过程中通过 yield 让 Pipeline 继续。"],"caveats":["收到事件不代表一定调用模型：等待器、插件返回、配置、唤醒和事件状态都会影响分支。"],"sources":[["astrbot/core/pipeline/process_stage/stage.py",16,75]]}},{"id":"StarRequestSubStage","label":"StarRequestSubStage","kind":"class","group":"agent","x":1120,"y":300,"summary":"消费 WakingCheckStage 写入的 activated_handlers 和参数，调用插件 handler；插件可写 result、stop 或返回 ProviderRequest。","file":"astrbot/core/pipeline/process_stage/method/star_request.py","fields":["ctx","prompt_prefix","identifier"],"methods":["initialize()","process(event)"],"sources":[["astrbot/core/pipeline/process_stage/method/star_request.py",20,100]],"explanation":{"role":"执行当前事件已经匹配到的插件 handler，把 handler 的结果继续传递给 ProcessStage。","logic":["从事件扩展字段读取 activated_handlers 和 handlers_parsed_params，按 handler 全名找到参数。","从 star_map 获取插件元信息；找不到插件则记录并跳过。调用 call_handler(event, handler.handler, **params)，透传异步产出。","记录 handler 的开始、结束或错误；错误时触发插件错误钩子，条件满足时写入消息结果并停止事件。"],"data":["输入是带有已匹配 handler 和解析参数的 AstrMessageEvent；输出可能包含 ProviderRequest，也可能通过事件结果与 yield 向后续阶段传值。"],"caveats":["这里消费的是前面阶段已经激活的 handler；自身不是所有插件的加载和注册器。"],"sources":[["astrbot/core/pipeline/process_stage/method/star_request.py",21,72],["astrbot/core/pipeline/process_stage/method/star_request.py",73,124]]}},{"id":"AgentRequestSubStage","importance":"key","label":"AgentRequestSubStage","kind":"class","group":"agent","x":1120,"y":500,"summary":"按 profile 的 AI 开关、SessionServiceManager 和 runner_type，把事件派发给 Internal 或 ThirdParty Agent。","file":"astrbot/core/pipeline/process_stage/method/agent_request.py","fields":["ctx","config","agent_sub_stage","prov_wake_prefix"],"methods":["initialize()","process(event)"],"sources":[["astrbot/core/pipeline/process_stage/method/agent_request.py",14,80]],"explanation":{"role":"Pipeline 的 Agent 请求分发阶段：依据配置选择本地或第三方 Agent 子阶段，并在每个事件到来时检查是否允许发起模型请求。","logic":["initialize() 保存 PipelineContext 和配置，去掉与 Bot 唤醒前缀重复的 Provider 前缀，规范化 agent_runner 设置后实例化并初始化 InternalAgentSubStage 或 ThirdPartyAgentSubStage。","process() 检查当前配置是否启用 AI，以及 SessionServiceManager 是否允许此会话发起 LLM 请求；任一不满足便跳过。","满足条件时记录 agent_start，异步遍历所选子阶段的 process(event, provider_wake_prefix)，透传其 yield；异常与正常结束分别记录 agent_end。"],"data":["输入为 AstrMessageEvent 和当前 PipelineContext 对应配置；此阶段把事件和处理后的唤醒前缀传给具体子阶段。"],"caveats":["此类负责选择和转交，并不直接调用模型；真正的本地模型工具循环和第三方 Agent 在各自子阶段中实现。","子阶段在 initialize() 时按配置选择，并非每处理一个事件都重新实例化。"],"sources":[["astrbot/core/pipeline/process_stage/method/agent_request.py",14,37],["astrbot/core/pipeline/process_stage/method/agent_request.py",39,80]]}},{"id":"InternalAgentSubStage","importance":"key","label":"InternalAgentSubStage","kind":"class","group":"agent","x":1120,"y":700,"summary":"本地 Agent 执行器。持有会话锁，调用 build_main_agent，消费 AgentResponse，并把最终链写回事件结果。","file":"astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py","fields":["ctx","main_agent_cfg","conv_manager","streaming_response"],"methods":["initialize()","process(event)"],"sources":[["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",78,130],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",221,325],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",394,480]],"explanation":{"role":"本地 Agent 路径的 Pipeline 子阶段，负责把消息事件转成交给主 Agent 的请求，运行 Agent，并将结果接回消息发送和会话历史流程。","logic":["initialize() 从当前 PipelineContext 配置读取模型、流式、工具超时、上下文压缩和显示策略等，并准备主 Agent 构建参数。","process() 检查文本、媒体、引用或插件提供的请求是否存在；处理 follow-up、输入状态和等待 LLM 的钩子，并检查额外唤醒前缀。","对 UMO 获取会话锁后再次检查配置与会话是否仍允许 LLM 请求，调用 build_main_agent(..., apply_reset=False)；若构建失败则根据事件中的错误信息处理并返回。","取得 runner、request、provider 和延迟 reset 协程，经过 OnLLMRequestEvent 钩子和图片处理后完成 reset，再根据流式能力和配置调用 run_agent。","流式时可将异步响应流放到 MessageEventResult，普通路径迭代 run_agent；结束后获取最终 LLMResponse，并在相应条件下保存历史。"],"data":["输入是当前事件及 Provider 唤醒前缀；主要中间对象是 MainAgentBuildConfig、MainAgentBuildResult、ProviderRequest、AgentRunner 和 MessageEventResult。"],"caveats":["相同 UMO 的处理有会话锁，排队期间配置可能变化，所以加锁后会再次判断；不能把其视为总是立即调用模型。","事件可因钩子、无内容、唤醒条件、取消或构建失败提前结束；流式分支的结果与非流式处理不同。"],"sources":[["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",78,114],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",167,200],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",221,286],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",307,325],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",394,467]]}},{"id":"ThirdPartyAgentSubStage","label":"ThirdPartyAgentSubStage","kind":"class","group":"agent","x":1120,"y":900,"summary":"外部 Agent Runner 分支，按 runner_type 调用 Dify/Coze/Dashscope/DeerFlow，并统一生成 AgentResponse。","file":"astrbot/core/pipeline/process_stage/method/agent_sub_stages/third_party.py","fields":["ctx","runner_type","runner_config"],"methods":["initialize()","process(event)"],"sources":[["astrbot/core/pipeline/process_stage/method/agent_sub_stages/third_party.py",87,178],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/third_party.py",280,365]],"explanation":{"role":"第三方 Agent Runner 的 Pipeline 分支；把事件输入整理成请求后，依据配置选择外部 Runner，并处理其响应。","logic":["initialize() 获取 runner_type、runner_config 和流式策略。","process() 检查 Provider 唤醒前缀，创建 ProviderRequest，复制 UMO、文本并收集可用图片和音频；内容为空则结束。","执行请求钩子，再按 runner_type 创建 Dify、Coze、Dashscope 或 DeerFlow Runner；未知类型抛出 ValueError。","根据平台流式能力与事件设置选择响应处理路径。"],"data":["事件文本、图片和音频成为 ProviderRequest；AstrAgentContext 把插件 Context 与事件交给所选 Runner。"],"caveats":["它与 InternalAgentSubStage 的本地工具循环是不同分支；各第三方服务的具体协议实现仍需继续查看对应 Runner。"],"sources":[["astrbot/core/pipeline/process_stage/method/agent_sub_stages/third_party.py",157,178],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/third_party.py",280,362]]}},{"id":"Context","importance":"key","label":"Context","kind":"class","group":"agent","x":1120,"y":1300,"summary":"插件和 Agent 的服务门面，持有 provider/platform/conversation/db/persona/kb/cron 等管理器。","file":"astrbot/core/star/context.py","fields":["provider_manager/platform_manager：模型和平台管理器","conversation_manager/message_history_manager：会话及平台历史","astrbot_config_mgr/persona_manager/kb_manager/cron_manager：共享服务","_db/_config/_event_queue：数据库、默认配置和事件队列"],"methods":["get_config(umo)：按 UMO 读取 profile 配置","get_using_provider_async()：选择 Provider","get_llm_tool_manager()：获取工具管理器","send_message(session, chain)：通过指定平台主动发送","tool_loop_agent()/llm_generate()：插件的 Agent 和直接 LLM 入口"],"sources":[["astrbot/core/star/context.py",132,180],["astrbot/core/star/context.py",529,560],["astrbot/core/star/context.py",665,748]],"explanation":{"role":"插件侧共享服务门面。它把平台、Provider、会话、数据库、配置、知识库和定时任务等核心服务汇集到一个入口，供插件和 Agent 获取；它不是单次模型对话的消息列表。","logic":["构造时接收各个管理器、默认配置、数据库和事件队列并保存引用，自身通常将操作委托给这些实际服务。","get_config(umo) 在没有 umo 时返回默认配置；提供 umo 时调用 AstrBotConfigManager.get_conf(umo) 获取该会话对应配置。","get_using_provider_async(umo) 调用 ProviderManager 查询当前会话的聊天模型，并校验返回类型；get_llm_tool_manager() 返回 provider_manager.llm_tools。","send_message(session, message_chain) 可先将会话字符串解析成 MessageSession，查找 platform_insts 中匹配的平台，再调用该实例的 send_by_session()；某些平台不支持主动发送。","llm_generate() 直接调用选定 Provider 的 text_chat() 返回 LLMResponse；tool_loop_agent() 则建立允许模型反复调用工具的 Agent 运行过程。"],"data":["输入和持有物主要是生命周期阶段注入的共享管理器；常用方法接受 UMO、消息链或请求参数。","与其他 Context 区分：这里是 astrbot.core.star.context.Context；PipelineContext 服务于管道阶段，AstrAgentContext 关联事件和插件服务，ContextWrapper 承载 Agent 运行状态。"],"caveats":["llm_generate() 即使传入工具定义，也不会自动执行模型返回的工具调用；需要自动工具循环时使用 tool_loop_agent()。","主动发送依赖具体平台实现，抽象 Platform 或本 Context 本身不负责所有平台协议转换。"],"sources":[["astrbot/core/star/context.py",132,182],["astrbot/core/star/context.py",184,226],["astrbot/core/star/context.py",228,267],["astrbot/core/star/context.py",397,399],["astrbot/core/star/context.py",529,558],["astrbot/core/star/context.py",648,694]]}},{"id":"SessionServiceManager","label":"SessionServiceManager","kind":"class","group":"agent","x":1120,"y":1500,"summary":"判断会话是否允许处理 LLM 请求，并管理会话启停状态。","file":"astrbot/core/star/session_llm_manager.py","fields":[],"methods":["is_llm_enabled_for_session()","set_llm_status_for_session()","should_process_llm_request()","is_session_enabled()"],"sources":[["astrbot/core/star/session_llm_manager.py",7,100]],"explanation":{"role":"按会话管理 LLM、TTS 等服务启停状态；Agent 请求阶段用它判断该会话是否允许 LLM 请求。","logic":["is_llm_enabled_for_session() 通过共享首选项以 UMO 为 scope 读取 session_service_config.llm_enabled；未设置时默认启用。","set_llm_status_for_session() 读取配置、更新 llm_enabled 并写回。","should_process_llm_request(event) 提取 event.unified_msg_origin 并调用会话级判断。"],"data":["持久化键为 session_service_config；输入的 session_id 是 UMO 字符串，结果为布尔值。"],"caveats":["会话级开关与 Pipeline 配置中的全局/档案级 provider_settings.enable 是不同检查，两个条件均可能阻止请求。"],"sources":[["astrbot/core/star/session_llm_manager.py",7,78],["astrbot/core/pipeline/process_stage/method/agent_request.py",39,50]]}},{"id":"AstrAgentContext","label":"AstrAgentContext","kind":"record","group":"agent","x":1120,"y":1700,"summary":"给 Agent 工具执行使用的上下文包装：Context + 当前 AstrMessageEvent + extra。","file":"astrbot/core/astr_agent_context.py","fields":["context：插件 Context","event：本轮 AstrMessageEvent","extra：Agent 扩展数据"],"methods":[],"sources":[["astrbot/core/astr_agent_context.py",10,21]],"explanation":{"role":"与单次 AstrBot Agent 运行相关的业务上下文：把插件服务 Context、当前 AstrMessageEvent 和附加数据放在一起，供工具及 hooks 使用。","logic":["创建时注入插件 Context 和本次 event；extra 默认是独立字典。build_main_agent() 创建它后，再用 AgentContextWrapper 包起来交给 Runner。","本地工具执行器从 run_context.context.event 取得事件；通过 run_context.context.context 可访问插件服务。"],"data":["context 是共享的 astrbot.core.star.context.Context；event 是本轮消息事件；extra 是该 Agent 上下文的扩展键值数据。"],"caveats":["AgentContextWrapper 只是 ContextWrapper[AstrAgentContext] 的类型别名；它与本数据对象及插件 Context 不是同一层。"],"sources":[["astrbot/core/astr_agent_context.py",1,22],["astrbot/core/astr_main_agent.py",1893,1897],["astrbot/core/astr_main_agent.py",2002,2009],["astrbot/core/astr_agent_tool_exec.py",685,695]]}},{"id":"ContextWrapper","label":"ContextWrapper[TContext]","kind":"class","group":"agent","x":1120,"y":1880,"summary":"把 Agent 专用上下文包装为 runner/tool executor 可识别的通用运行上下文。","file":"astrbot/core/agent/run_context.py","fields":["context：AstrAgentContext","messages：Runner 维护的 Message 列表","tool_call_timeout：工具调用超时"],"methods":["由 Runner.reset() 接收并传递给工具执行器"],"sources":[["astrbot/core/agent/run_context.py",13,22]],"explanation":{"role":"Agent 框架通用的运行上下文容器，保存业务上下文、运行期间的消息列表和工具调用超时。","logic":["泛型字段 context 可承载不同业务的上下文；在 AstrBot 主 Agent 中通常承载 AstrAgentContext。","messages 由 Agent Runner 维护，用于保存本次运行的模型消息；tool_call_timeout 传递给工具执行路径，默认 120 秒。","Runner.reset() 接收整个包装，执行工具时再交给 FunctionToolExecutor 或其他工具执行器。"],"data":["访问层次为 ContextWrapper.context → AstrAgentContext → 插件 Context / AstrMessageEvent；messages 并不是插件 Context 本身。"],"caveats":["这是泛型类型，context 不总是 AstrAgentContext；NoContext 表示无业务上下文的另一种用法。"],"sources":[["astrbot/core/agent/run_context.py",1,23],["astrbot/core/astr_agent_context.py",10,22],["astrbot/core/agent/runners/tool_loop_agent_runner.py",210,215],["astrbot/core/agent/runners/tool_loop_agent_runner.py",278,282]]}},{"id":"MainAgentBuildConfig","label":"MainAgentBuildConfig","kind":"record","group":"provider","x":1470,"y":100,"summary":"传给 build_main_agent 的控制参数数据类，不包含 event、Context 或已有 ProviderRequest。","file":"astrbot/core/astr_main_agent.py","fields":["tool_call_timeout/tool_schema_mode：工具超时和 schema 模式","provider_wake_prefix/streaming_response：触发条件与流式策略","provider_settings/fallback_provider_ids：模型配置","file_extract_enabled/kb_agentic_mode/computer_use_runtime/add_cron_tools：输入处理和工具能力开关"],"methods":[],"sources":[["astrbot/core/astr_main_agent.py",189,250]],"explanation":{"role":"主 Agent 构建配置的数据类，集中描述本次构建所需的模型、工具、上下文、文件和运行环境策略，由 build_main_agent() 与运行器读取。","logic":["tool_call_timeout 控制工具调用超时，tool_schema_mode 决定工具描述模式；provider_wake_prefix 和 streaming_response 分别影响触发与响应。","max_context_length、dequeue_context_length 及 llm_compress_* 设置会传给 Runner 的上下文管理逻辑；fallback_provider_ids 和 request_max_retries 控制候选提供商及请求重试。","kb_agentic_mode、file_extract_enabled、computer_use_runtime 与 add_cron_tools 决定知识库、附件与工具的准备方式。"],"data":["它由多项配置值构成，并非事件或模型请求本身；InternalAgentSubStage 使用当前事件的唤醒前缀和流式设置生成本次使用的配置副本。"],"caveats":["该类的字段定义说明可用配置，实际生效条件还要查看构建和执行分支；不要假设每次运行都会使用所有工具。"],"sources":[["astrbot/core/astr_main_agent.py",188,247],["astrbot/core/astr_main_agent.py",2002,2027],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",253,270]]}},{"id":"MainAgentBuildResult","label":"MainAgentBuildResult","kind":"record","group":"provider","x":1470,"y":300,"summary":"build_main_agent 的组合结果，返回 runner、ProviderRequest、Provider 和 reset_coro。","file":"astrbot/core/astr_main_agent.py","fields":["agent_runner：配置好的 Runner","provider_request：构建后的请求","provider：选择的模型","reset_coro：可延迟执行的 reset 协程"],"methods":[],"sources":[["astrbot/core/astr_main_agent.py",251,255],["astrbot/core/astr_main_agent.py",2000,2042]],"explanation":{"role":"build_main_agent() 成功时返回的组合结果，把构建好的运行器、请求和选中的 Provider 交给调用方继续执行。","logic":["agent_runner 用于后续运行；provider_request 是本次构建或补充的请求；provider 是已选择的具体聊天提供商。","当调用 build_main_agent(apply_reset=False) 时，reset_coro 保存待执行的 reset 协程；调用方可先处理请求钩子再等待初始化。"],"data":["这四个字段是不同对象的引用：配置与调用所需信息汇聚到结果，并非模型响应或最终用户回复。"],"caveats":["构建函数也可能返回 None；调用方必须处理失败或跳过分支。reset_coro 不为空时，不能假设 Runner 已经初始化。"],"sources":[["astrbot/core/astr_main_agent.py",250,255],["astrbot/core/astr_main_agent.py",2002,2042],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",263,286],["astrbot/core/pipeline/process_stage/method/agent_sub_stages/internal.py",307,325]]}},{"id":"ProviderRequest","importance":"key","label":"ProviderRequest","kind":"record","group":"provider","x":1470,"y":500,"summary":"Provider 请求中间模型：承载 prompt、上下文、会话、媒体、工具集、系统提示和工具结果。","file":"astrbot/core/provider/entities.py","fields":["prompt/contexts：当前文本与历史","image_urls/audio_urls/extra_user_content_parts：多模态输入","func_tool：ToolSet","conversation/session_id：会话数据","tool_calls_result：工具调用及结果","model/system_prompt：模型与系统指令"],"methods":["assemble_context()：序列化多模态用户消息","append_tool_calls_result()：追加工具调用结果"],"sources":[["astrbot/core/provider/entities.py",194,421]],"explanation":{"role":"一次模型请求在 AstrBot 内部的中间表示，汇总用户输入、上下文、工具定义、系统提示词和关联会话。它连接事件收集与 Agent/Provider 调用。","logic":["prompt、image_urls、audio_urls 和 extra_user_content_parts 描述当前输入；contexts 保存已有上下文；func_tool 指向本次请求可见的 ToolSet。","assemble_context() 将当前文本、多模态引用和额外内容组装成 role=user 的字典。图片引用读取成 data URL，音频按 wav 解析；媒体读取失败时有跳过或占位处理。","仅有一个普通文本块且无额外内容或媒体时，content 为字符串；否则 content 为内容块数组。返回形状因输入而异。","append_tool_calls_result() 将传入的 ToolCallsResult 追加到 tool_calls_result；若旧值是单个对象则先转换为列表。Agent 后续轮次使用工具结果继续模型对话。"],"data":["session_id 通常关联当前 UMO；conversation 可引用会话对象；model 为 None 时由 Provider 使用默认模型。","ToolCallsResult 保存模型发出的工具调用信息以及工具结果消息；它不同于 FunctionTool 的定义，也不同于工具执行器返回的 MCP CallToolResult。"],"caveats":["assemble_context() 的职责是组装和读取当前媒体引用，不代表最终厂商 HTTP 请求结构；厂商适配由 Provider 后续处理。","图中同时出现的 contexts、conversation 和单次 prompt 并不是同一对象，理解上下文时要分别查看用途。"],"sources":[["astrbot/core/provider/entities.py",169,190],["astrbot/core/provider/entities.py",193,219],["astrbot/core/provider/entities.py",235,241],["astrbot/core/provider/entities.py",291,347],["astrbot/core/provider/entities.py",349,418]]}},{"id":"AbstractProvider","label":"AbstractProvider","kind":"abstract","group":"provider","x":1470,"y":700,"summary":"Provider 家族共同基类，保存模型、配置和请求头；聊天接口在其子类 Provider 定义。","file":"astrbot/core/provider/provider.py","fields":["model_name","provider_config","request_headers"],"methods":["set_model()","get_model()","meta()","test()"],"sources":[["astrbot/core/provider/provider.py",33,73]],"explanation":{"role":"Provider 家族的公共基类，保存提供商配置、当前模型名和自定义请求头；聊天 Provider 是它的子类之一。","logic":["构造时保存 provider_config，并据 custom_headers 构造请求头。","set_model()/get_model() 管理当前模型名称；meta() 根据 provider_config.type 查询已注册元数据并构造 ProviderMeta。"],"data":["provider_config.id、type 和 model_name 等组合成对外使用的 ProviderMeta；未找到对应类型注册信息时 meta() 抛出 ValueError。"],"caveats":["它不实现具体聊天网络请求；text_chat 契约在子类 Provider 定义，具体适配器再实现。"],"sources":[["astrbot/core/provider/provider.py",33,75]]}},{"id":"Provider","importance":"key","label":"Provider","kind":"abstract","group":"provider","x":1470,"y":880,"summary":"聊天 Provider 抽象基类；具体厂商子类调用 SDK、构造厂商请求并转换响应。","file":"astrbot/core/provider/provider.py","fields":["provider_config","provider_settings"],"methods":["text_chat()","text_chat_stream()","get_models()"],"sources":[["astrbot/core/provider/provider.py",75,221]],"explanation":{"role":"聊天模型提供商的抽象契约，定义请求文本对话、模型列表和 API Key 管理等接口，具体厂商适配由子类完成。","logic":["继承 AbstractProvider，保存 provider_config、provider_settings 与模型状态；get_models()、text_chat() 等抽象方法要求具体实现。","text_chat() 的契约接收 prompt、上下文、媒体、ToolSet、系统提示和工具结果等，并返回统一 LLMResponse。","text_chat_stream() 声明异步流式接口；基类默认抛 NotImplementedError，具体流式支持取决于子类。"],"data":["ProviderRequest 中的内容由 Runner 按 Provider 方法参数传递；具体 Provider 负责适配远程 API 并产生 LLMResponse。"],"caveats":["抽象基类本身不代表已经实现网络请求或所有厂商协议；阅读具体子类才能了解实际请求格式、错误处理和支持能力。"],"sources":[["astrbot/core/provider/provider.py",33,50],["astrbot/core/provider/provider.py",75,120],["astrbot/core/provider/provider.py",144,181]]}},{"id":"ProviderOpenAIOfficial","label":"ProviderOpenAIOfficial","kind":"class","group":"provider","x":1470,"y":1980,"importance":"key","summary":"OpenAI Chat Completions 的具体 Provider 实现。它把 ProviderRequest 转成 OpenAI 兼容 payload，调用 AsyncOpenAI，再把 SDK 响应解析为 LLMResponse。","file":"astrbot/core/provider/sources/openai_source.py","fields":["client：AsyncOpenAI 客户端","api_keys：可轮换的 API Key","provider_config：base_url、参数覆盖和重试配置"],"methods":["text_chat() / text_chat_stream()：构造请求并处理重试","_prepare_chat_payload()：contexts + 当前消息 → messages/model payload","_query() / _query_stream()：调用 chat.completions.create()","_parse_openai_completion()：SDK completion → LLMResponse"],"sources":[["astrbot/core/provider/sources/openai_source.py",52,52],["astrbot/core/provider/sources/openai_source.py",357,390],["astrbot/core/provider/sources/openai_source.py",532,590],["astrbot/core/provider/sources/openai_source.py",838,955],["astrbot/core/provider/sources/openai_source.py",956,1015],["astrbot/core/provider/sources/openai_source.py",1192,1255]],"explanation":{"role":"Provider 的具体实现，使用 OpenAI 兼容聊天接口，把内部请求数据转换为 SDK payload，并将 completion 解析为统一 LLMResponse。","logic":["text_chat() 调用 _prepare_chat_payload()，整理上下文、当前用户内容、系统提示与工具结果，选择模型并形成 messages/model payload。","_query() 将 ToolSet 转换为 OpenAI 风格工具定义，将非标准参数放入 extra_body，经过重试封装调用 client.chat.completions.create()。","_parse_openai_completion() 读取 SDK 的 ChatCompletion，提取文本、推理、工具调用等内容；缺少 choices 时抛出空输出错误。","text_chat_stream() 提供流式调用路径，具体分块与完整结果的处理需要结合对应方法阅读。"],"data":["输入是内部请求拆解后的 prompt、contexts、func_tool 和 tool_calls_result；远程 SDK 返回 ChatCompletion，解析结果是 LLMResponse。"],"caveats":["这是具体适配器示例，不代表其他 Provider 必然使用相同协议；兼容服务、额外请求参数及媒体支持可能改变行为。"],"sources":[["astrbot/core/provider/sources/openai_source.py",532,590],["astrbot/core/provider/sources/openai_source.py",838,870],["astrbot/core/provider/sources/openai_source.py",956,1006],["astrbot/core/provider/sources/openai_source.py",1192,1240]]}},{"id":"LLMResponse","importance":"key","label":"LLMResponse","kind":"record","group":"provider","x":1470,"y":1060,"summary":"Provider 返回的统一响应，可能包含文本、流式增量、工具调用、usage 和错误信息。","file":"astrbot/core/provider/entities.py","fields":["role","result_chain","completion_text","tools_call_name","tools_call_args","tools_call_ids","reasoning_content","raw_completion","is_chunk","usage"],"methods":["__init__()"],"sources":[["astrbot/core/provider/entities.py",454,608]],"explanation":{"role":"模型提供商返回的统一结果，可能包含文本或消息链、工具调用、推理内容、原始响应、流式标记和 token 用量。","logic":["初始化时将未给出的工具调用名称、参数、ID 等设为空集合；role 标记 assistant、tool 或 err 等响应角色。","读取 completion_text 时若 result_chain 存在，会从消息链取纯文本，否则返回内部文本字段；设置时也根据是否存在消息链走不同分支。","to_openai_tool_calls_model() 根据工具调用参数、名称与 ID 构造 ToolCall 模型列表，并将参数 JSON 序列化。","Runner 识别工具调用后会依名称和参数继续执行工具；没有后续工具调用时可据响应完成最终结果。"],"data":["tools_call_name、tools_call_args、tools_call_ids 是按索引对应的列表；raw_completion 保留具体 Provider 原始对象，usage 是可选 TokenUsage。"],"caveats":["is_chunk 为真时对象可能只是流式片段，不等于完整回答；result_chain、completion_text、工具调用也不保证同时存在。","LLMResponse 是模型结果，AgentResponse 是 Runner 对执行过程的产出包装，两者职责不同。"],"sources":[["astrbot/core/provider/entities.py",454,486],["astrbot/core/provider/entities.py",488,561],["astrbot/core/provider/entities.py",583,600],["astrbot/core/agent/runners/tool_loop_agent_runner.py",1178,1201]]}},{"id":"ToolCallsResult","label":"ToolCallsResult","kind":"record","group":"provider","x":1470,"y":1240,"summary":"工具执行结果的中间包装，附带 tool_call_id、工具名和结果链，追加回 ProviderRequest 上下文。","file":"astrbot/core/provider/entities.py","fields":["tool_calls_info","tool_calls_result"],"methods":["to_openai_messages()","to_openai_messages_model()"],"sources":[["astrbot/core/provider/entities.py",169,192]],"explanation":{"role":"把一次助手工具调用消息和对应的一组工具结果消息放在一起，供后续模型请求继续使用。","logic":["to_openai_messages 按助手调用消息在前、工具结果消息在后的顺序序列化成字典列表。","to_openai_messages_model 保留消息模型对象；ProviderRequest.append_tool_calls_result 可把结果追加到请求。"],"data":["tool_calls_info 为 AssistantMessageSegment；tool_calls_result 为 ToolCallMessageSegment 列表。"],"caveats":["这个对象是一次工具调用往返的消息组合，不是工具执行器，也不是模型发出的 ToolCall 数据本身。"],"sources":[["astrbot/core/provider/entities.py",169,192],["astrbot/core/provider/entities.py",218,253]]}},{"id":"TokenUsage","label":"TokenUsage","kind":"record","group":"provider","x":1470,"y":1420,"summary":"记录输入、输出和总 token；由 AgentStats 聚合并在 AgentResponse 流中传递。","file":"astrbot/core/provider/entities.py","fields":["input_other","input_cached","output","input","total"],"methods":["__add__()","__sub__()"],"sources":[["astrbot/core/provider/entities.py",422,452]],"explanation":{"role":"统一表示一次或累计的 token 用量，支持按字段汇总或求差。","logic":["input 属性计算 input_other 与 input_cached 的和，total 再加 output。","加法和减法分别对三个原始字段逐项运算，生成新的 TokenUsage；AgentStats 可持有它。"],"data":["input_other 是非缓存输入，input_cached 是缓存输入，output 是输出 token；input 和 total 是计算属性。"],"caveats":["input、total 不是额外独立累计项，不应在 input_other/input_cached 之外再次相加。","减法直接按字段相减；具体值是否合理取决于调用方提供的数据。"],"sources":[["astrbot/core/provider/entities.py",422,452],["astrbot/core/agent/response.py",19,39]]}},{"id":"Agent","label":"Agent[TContext]","kind":"class","group":"provider","x":1470,"y":1600,"summary":"Agent 定义子 Agent 的名称、指令、工具、hooks 和初始对话；不是持有 Runner 的运行对象。","file":"astrbot/core/agent/agent.py","fields":["name/instructions：子 Agent 身份与指令","tools：工具列表","run_hooks：生命周期 hooks","begin_dialogs：初始对话"],"methods":[],"sources":[["astrbot/core/agent/agent.py",10,15]],"explanation":{"role":"Agent 的声明性数据类，描述名称、指令、工具、生命周期 hooks 与初始对话；它描述一个 Agent 的配置，不负责模型调用循环。","logic":["name 指定身份，instructions 可保存指令；tools 可以包含工具名称或 FunctionTool 对象。","run_hooks 提供可选的运行钩子，begin_dialogs 保存初始对话。当前定义本身只有字段，没有执行方法。"],"data":["输入是创建时给出的字段；其 tools 是声明的工具列表，和实际请求中的 ToolSet、用于迭代执行的 ToolLoopAgentRunner 属于不同层次。"],"caveats":["不要把此 Agent 数据类与 AgentRunner 运行器视为同一个对象，也不要以该类字段推断其全部调用方。"],"sources":[["astrbot/core/agent/agent.py",1,15]]}},{"id":"BaseAgentRunner","label":"BaseAgentRunner[TContext]","kind":"abstract","group":"provider","x":1470,"y":1780,"summary":"Agent Runner 抽象协议，规定 reset/step/step_until_done 等运行控制。","file":"astrbot/core/agent/runners/base.py","fields":[],"methods":["reset()","step()","step_until_done()","done()","get_final_llm_resp()"],"sources":[["astrbot/core/agent/runners/base.py",13,71]],"explanation":{"role":"定义 Agent 运行器通用接口和状态访问方式的基类；本地 ToolLoopAgentRunner 等实现具体运行逻辑。","logic":["reset() 在运行前准备 ContextWrapper 和 hooks；step() 处理一步并异步产出 AgentResponse；step_until_done() 按步运行。","done() 判断是否结束，get_final_llm_resp() 提供最终模型响应；state 与 _transition_state() 管理状态读取和变化。"],"data":["AgentState 定义 IDLE、RUNNING、DONE、ERROR；输入和输出依具体 Runner 实现补充。"],"caveats":["接口定义并不说明每种 Runner 的模型服务、工具执行或停止方式，不能把本地 Runner 的细节套到所有实现。"],"sources":[["astrbot/core/agent/runners/base.py",14,72]]}},{"id":"ToolLoopAgentRunner","importance":"key","label":"ToolLoopAgentRunner","kind":"class","group":"tools","x":1820,"y":100,"summary":"本地 Agent 主循环：请求 Provider，遇到 tool_call 就执行工具，把 ToolCallsResult 追加回 ProviderRequest 后继续下一轮。","file":"astrbot/core/agent/runners/tool_loop_agent_runner.py","fields":["provider：当前 Provider","req：ProviderRequest","run_context：ContextWrapper 与消息列表","tool_executor：工具执行器","stats：AgentStats"],"methods":["reset()：初始化运行依赖","step()：请求模型、处理响应、执行工具并继续循环","_handle_function_tools()：执行模型要求的工具并包装结果","_resolve_tool_exec()：skills_like 模式下补全工具参数 schema","step_until_done()/done()：循环并判定终态"],"sources":[["astrbot/core/agent/runners/tool_loop_agent_runner.py",111,164],["astrbot/core/agent/runners/tool_loop_agent_runner.py",807,1070],["astrbot/core/agent/runners/tool_loop_agent_runner.py",1146,1244],["astrbot/core/agent/runners/tool_loop_agent_runner.py",1480,1560]],"explanation":{"role":"执行本地 Agent 的多轮模型与工具循环：维护一次运行的请求、消息、状态和执行器，把模型工具调用交给工具执行器，再把结果交还给后续模型轮次。","logic":["reset() 接收 Provider、ProviderRequest、ContextWrapper、工具执行器和 hooks；建立 ContextManager，初始化状态、停止信号、fallback providers 等运行数据。","step() 首次运行调用 agent begin hook，将状态转换为运行中；先通过 ContextManager 处理消息，再向 Provider 请求并逐步产出 AgentResponse。","当 LLMResponse 包含工具调用时，_handle_function_tools() 根据名称、参数和调用 ID 定位工具，执行工具开始 hook，调用 tool_executor.execute() 并处理异步返回。","工具文本、图片等结果被整理为工具消息；组装 ToolCallsResult 后既扩展 run_context.messages，也通过 req.append_tool_calls_result() 登记到请求。下一轮可基于新消息继续。","step_until_done(max_step) 持续执行 step() 到终态或步数上限；到上限仍未结束时移除可用工具、注入提示并执行最后一步。"],"data":["ProviderRequest 保存本次请求，ContextWrapper 保存本次运行的消息和业务上下文；LLMResponse 是模型输出，AgentResponse 是对运行过程产出的包装。","工具执行器可能返回 CallToolResult 或消息链，Runner 对其结果进行归一和后续处理；图片可先进入缓存再提供给后续流程。"],"caveats":["一次 step 不一定产生最终答案；有工具调用时可继续多轮。流式响应、失败、停止请求和插件 hooks 会改变运行路径。","skills_like 模式会将请求中的完整工具集替换为轻量 schema，同时保留原工具集及仅参数工具集供后续查询；不能把发送给模型的工具描述误认作可执行对象本身。"],"sources":[["astrbot/core/agent/runners/tool_loop_agent_runner.py",210,312],["astrbot/core/agent/runners/tool_loop_agent_runner.py",807,839],["astrbot/core/agent/runners/tool_loop_agent_runner.py",1008,1036],["astrbot/core/agent/runners/tool_loop_agent_runner.py",1090,1144],["astrbot/core/agent/runners/tool_loop_agent_runner.py",1146,1201],["astrbot/core/agent/runners/tool_loop_agent_runner.py",1251,1325]]}},{"id":"ContextManager","label":"ContextManager","kind":"class","group":"tools","x":1820,"y":300,"summary":"在每次 Provider 请求前整理 Message 列表、截断/压缩上下文并维护 checkpoint。","file":"astrbot/core/agent/context/manager.py","fields":["config","token_counter","compressor","truncator"],"methods":["process()","_run_compression()"],"sources":[["astrbot/core/agent/context/manager.py",11,156]],"explanation":{"role":"Agent 模型请求前的消息上下文处理器，根据轮数和 token 限制截断或压缩消息，缓解上下文过长。","logic":["构造时优先使用自定义 compressor；否则按是否配置 LLM 压缩 Provider 选择 LLM 摘要压缩或按轮截断压缩。","process() 先按 enforce_max_turns 截断，再在 max_context_tokens 大于 0 时估算 token 并决定是否压缩。","压缩后如仍超限，_run_compression() 保留前面的系统消息和最新一轮，逐轮移除更早消息并重新计算。","处理抛错时记录异常并返回原始消息列表。"],"data":["输入和输出均是 list[Message]；trusted_token_usage 用于 token 估算。ToolLoopAgentRunner 在每轮请求前使用处理后的 messages。"],"caveats":["这里的 ContextManager 是模型消息压缩器，不是插件服务 Context 或会话管理器；最新一轮单独超限时也会保留并继续发送。"],"sources":[["astrbot/core/agent/context/manager.py",11,39],["astrbot/core/agent/context/manager.py",40,80],["astrbot/core/agent/context/manager.py",81,143],["astrbot/core/agent/runners/tool_loop_agent_runner.py",827,839]]}},{"id":"FunctionToolManager","importance":"key","label":"FunctionToolManager","kind":"class","group":"tools","x":1820,"y":500,"summary":"维护插件工具、内置工具和 MCP 工具；把它们汇总为 ToolSet 或厂商 schema。","file":"astrbot/core/provider/func_tool_manager.py","fields":["func_list：插件和 MCP 工具","builtin_func_list：按类缓存内置工具","_mcp_server_runtime：MCP 客户端运行时"],"methods":["get_full_tool_set()：为非内置工具添加权限包装后构造 ToolSet","init_mcp_clients()/_start_mcp_server()：连接服务并注册 MCPTool","get_builtin_tool()：按需取得内置工具"],"sources":[["astrbot/core/provider/func_tool_manager.py",288,360],["astrbot/core/provider/func_tool_manager.py",496,514],["astrbot/core/provider/func_tool_manager.py",540,760]],"explanation":{"role":"管理插件工具、MCP 工具以及按需创建的内置工具，并管理 MCP 服务连接的启动和关闭。它负责工具注册与可用集合的准备，不是每次工具调用的执行器。","logic":["func_list 保存非内置的插件工具和 MCPTool；builtin_func_list 以工具类为键缓存按需创建的内置工具；_mcp_server_runtime 保存服务运行时。","_start_mcp_server() 在锁保护下检查同名服务是否正在运行或启动，创建 MCPClient，连接服务并列出 mcp.Tool；每个 mcp.Tool 被包装为 MCPTool 后放入 func_list。","get_full_tool_set() 遍历当前 func_list，用 _PermissionGuardedTool 包装每个工具，再通过 ToolSet.add_tool() 建立集合；同名工具遵循 ToolSet 的启用状态和覆盖规则。","权限包装器调用时先读取工具权限配置并检查当前事件；允许后才委托原工具的 handler、重写的 call 或兼容 run。"],"data":["MCP 服务返回 mcp.Tool 描述 → MCPTool 适配为 FunctionTool → _PermissionGuardedTool 包装 → ToolSet 可供请求选择。","内置工具通过 get_builtin_tool() 按需获取；主 Agent 可根据配置和平台能力单独加入请求工具集。"],"caveats":["当前 get_full_tool_set() 实现只遍历 func_list，不会自动把 builtin_func_list 中全部内置工具加入结果。","经过权限包装的 MCPTool 直接暴露给执行器的对象是包装器；它在通过权限检查后再委托原 MCPTool，不能仅按最外层类型判断全部内部调用路径。"],"sources":[["astrbot/core/provider/func_tool_manager.py",214,269],["astrbot/core/provider/func_tool_manager.py",288,301],["astrbot/core/provider/func_tool_manager.py",453,513],["astrbot/core/provider/func_tool_manager.py",644,710],["astrbot/core/astr_main_agent.py",1911,1935]]}},{"id":"ToolSet","label":"ToolSet","kind":"class","group":"tools","x":1820,"y":700,"summary":"一次 Agent 运行可见的工具集合；按名称查找 FunctionTool，并生成 Provider 所需工具定义。","file":"astrbot/core/agent/tool.py","fields":["tools"],"methods":["add_tool()","get_tool()","openai_schema()","anthropic_schema()","google_schema()"],"sources":[["astrbot/core/agent/tool.py",79,160]],"explanation":{"role":"FunctionTool 对象的集合，供一次请求携带可用工具，并向不同 Provider 导出相应 schema；它主要管理工具定义，不直接运行工具。","logic":["add_tool() 按名称去重：已有工具为启用而新工具为停用时保留已有项；新工具启用，或已有工具停用时，用新项覆盖。","get_tool(name) 按名称返回工具对象或 None；后续 Runner 根据模型指定的名称查找工具并交给执行器。","get_light_tool_set() 为启用的工具创建只含名称、描述和空参数的轻量对象；get_param_only_tool_set() 为启用工具生成仅名称与参数的对象，供 skills_like 模式使用。","不同 schema 方法将工具描述转换成相应 Provider 所需结构，转换后的定义与执行工具的对象不是同一回事。"],"data":["tools 是 FunctionTool 列表，ProviderRequest.func_tool 可以引用 ToolSet；工具的 parameters 是 JSON Schema 形式的参数说明。"],"caveats":["轻量和仅参数工具集会新建没有 handler 的工具描述；实际执行需要回到原始工具对象或相应执行路径。"],"sources":[["astrbot/core/agent/tool.py",20,38],["astrbot/core/agent/tool.py",41,74],["astrbot/core/agent/tool.py",78,160],["astrbot/core/agent/tool.py",204,270]]}},{"id":"FunctionTool","label":"FunctionTool","kind":"class","group":"tools","x":1820,"y":880,"summary":"统一工具描述和调用契约；保存 name/description/parameters，call() 返回 ToolExecResult。","file":"astrbot/core/agent/tool.py","fields":["name","description","parameters","handler","handler_module_path","active","is_background_task"],"methods":["call()"],"sources":[["astrbot/core/agent/tool.py",21,76]],"explanation":{"role":"AstrBot 内部统一的函数工具描述与调用契约，继承 ToolSchema，并由本地工具、MCPTool 和权限包装等具体对象使用。","logic":["继承的 name、description、parameters 描述模型可见工具，其中 parameters 是 JSON Schema；ToolSchema 的校验器检查其 schema 是否有效。","handler 可保存装饰器注册的异步处理函数；active 标明启用状态，is_background_task 指示后台执行。","基础 call() 抛出 NotImplementedError；实际工具可提供 handler，或由子类实现 call 等执行入口。FunctionToolExecutor 负责选择调用方式。"],"data":["FunctionTool 是工具定义与执行入口，不是模型返回的工具调用，也不是 CallToolResult 执行结果。"],"caveats":["ToolSet 中可能存在权限代理或轻量 schema 对象，单看该对象名称不能假设其 handler 一定存在。"],"sources":[["astrbot/core/agent/tool.py",20,38],["astrbot/core/agent/tool.py",41,74],["astrbot/core/astr_agent_tool_exec.py",697,717]]}},{"id":"BaseFunctionToolExecutor","label":"BaseFunctionToolExecutor","kind":"abstract","group":"tools","x":1820,"y":1060,"summary":"工具执行器抽象契约，定义 execute(tool, run_context, **args)。","file":"astrbot/core/agent/tool_executor.py","fields":[],"methods":["execute()"],"sources":[["astrbot/core/agent/tool_executor.py",10,17]],"explanation":{"role":"工具执行器的通用接口，声明接收 FunctionTool、ContextWrapper 和工具参数的 execute() 异步生成器。","logic":["调用者通过 execute(tool, run_context, **tool_args) 传入工具与运行上下文，并异步消费执行结果。","AstrBot 的 FunctionToolExecutor 提供具体本地、MCP、委派和后台工具分支。"],"data":["返回的生成器元素允许一般结果或 MCP CallToolResult；具体行为以实际执行器为准。"],"caveats":["这个基类的 execute 只有接口占位，不应把它画成真正执行远程或本地工具的实现。"],"sources":[["astrbot/core/agent/tool_executor.py",1,18],["astrbot/core/astr_agent_tool_exec.py",136,205]]}},{"id":"FunctionToolExecutor","importance":"key","label":"FunctionToolExecutor","kind":"class","group":"tools","x":1820,"y":1240,"summary":"按工具类型分流：本地 FunctionTool、MCPTool、HandoffTool、后台任务，并把结果统一成 CallToolResult/MessageChain。","file":"astrbot/core/astr_agent_tool_exec.py","fields":[],"methods":["execute()：区分 Handoff、MCP、后台或本地工具分支","_execute_local()：执行 handler 或工具 call/run 并转换结果","_execute_mcp()：调用 MCPTool","_execute_handoff()：委派子 Agent"],"sources":[["astrbot/core/astr_agent_tool_exec.py",61,80],["astrbot/core/astr_agent_tool_exec.py",136,205],["astrbot/core/astr_agent_tool_exec.py",685,793]],"explanation":{"role":"AstrBot 的具体工具执行器，接收工具对象、Agent 运行上下文和模型产生的参数，按工具类型选择执行路径，并将结果以异步生成器交还给 Runner。","logic":["execute() 先判断 HandoffTool，按参数选择前台或后台子 Agent 路径；如果是 MCPTool 则调用 _execute_mcp()。","声明为后台任务的其他工具会创建异步任务并注册，立即产出包含 task_id 的 CallToolResult；普通情况进入 _execute_local()。","_execute_local() 从 run_context.context.event 取得当前事件；缺少事件时报错。它优先选择 handler，其次选择重写的 call，最后兼容 run，并结合调用超时处理执行。","Runner 消费执行器产生的 CallToolResult 或消息链，再整理为后续模型可用的工具结果。"],"data":["输入的 ContextWrapper 内部持有 AstrAgentContext，其 event 用于本地工具和权限检查；**tool_args 来自模型工具调用。","如果工具外面有 _PermissionGuardedTool，执行器先按包装器进入本地执行路径，由包装器检查权限后再委托内部工具，内部可以是 MCPTool。"],"caveats":["MCPTool 不一定总以最外层类型到达 execute()；需要结合是否经过权限包装理解实际分支。"],"sources":[["astrbot/core/astr_agent_tool_exec.py",136,205],["astrbot/core/astr_agent_tool_exec.py",685,721],["astrbot/core/provider/func_tool_manager.py",214,269],["astrbot/core/agent/runners/tool_loop_agent_runner.py",1288,1309]]}},{"id":"MCPClient","importance":"key","label":"MCPClient","kind":"class","group":"tools","x":1820,"y":1420,"summary":"MCP 连接和会话封装；负责 transport、initialize、list_tools、重连和 call_tool。","file":"astrbot/core/agent/mcp_client.py","fields":["session：MCP ClientSession","tools：服务端列出的工具 schema","_server_name/_mcp_server_config：重连配置","_connection_task/_reconnect_lock：连接任务和重连锁"],"methods":["connect_to_server()：连接并初始化 MCP 服务","list_tools_and_save()：读取 mcp.Tool 列表","call_tool_with_reconnect()：调用工具并在连接失败时尝试重连","cleanup()：关闭连接"],"sources":[["astrbot/core/agent/mcp_client.py",392,430],["astrbot/core/agent/mcp_client.py",465,660],["astrbot/core/agent/mcp_client.py",726,790]],"explanation":{"role":"一个 MCP 服务的连接与会话封装，负责建立连接、发现服务工具、调用远程工具、连接关闭和特定连接错误后的重连。","logic":["connect_to_server() 启动连接并初始化 MCP 会话；连接状态和清理由拥有连接的任务管理。","list_tools_and_save() 要求 session 已初始化，调用 session.list_tools()，把 response.tools 保存到 self.tools，并返回 ListToolsResult。","call_tool_with_reconnect() 使用原始工具名、参数和读取超时调用 session.call_tool()。发生 ClosedResourceError 时尝试重连并由重试机制再次调用，最多两次尝试。","cleanup() 取消连接任务、等待仍未结束的旧连接任务并设置运行事件，以解除等待者。"],"data":["self.tools 是远端声明的 mcp.Tool 列表，不是已经能直接放进 AstrBot ToolSet 的最终包装；FunctionToolManager 再将其逐个包装成 MCPTool。","远程调用结果为 mcp.types.CallToolResult，包含服务端返回的内容；工具调用超时来自调用参数。"],"caveats":["自动重连针对代码列出的 ClosedResourceError；不能推断所有异常都会重试，session 不存在会抛 ValueError。","本地 mcp_client.py 存在未提交的空白行变动；源码链接指向图声明的仓库提交。"],"sources":[["astrbot/core/agent/mcp_client.py",392,415],["astrbot/core/agent/mcp_client.py",465,519],["astrbot/core/agent/mcp_client.py",653,659],["astrbot/core/agent/mcp_client.py",726,790]]}},{"id":"MCPTool","label":"MCPTool","kind":"class","group":"tools","x":1820,"y":1600,"summary":"把 MCP 原始工具包装成 FunctionTool；LLM 看见 sanitized name/schema，调用时还原原始工具名并回到 MCPClient。","file":"astrbot/core/agent/mcp_client.py","fields":["name","mcp_tool","mcp_client","mcp_server_name","parameters"],"methods":["call()"],"sources":[["astrbot/core/agent/mcp_client.py",793,817]],"explanation":{"role":"FunctionTool 的一个具体实现，将 MCP 服务发现的单个 mcp.Tool 转换为 AstrBot 可注册和执行的工具对象。","logic":["构造时接收原始 mcp.Tool、MCPClient 和服务名称；将原始名称中不符合允许字符的片段替换为下划线，作为暴露给模型的名称。","使用 mcp.Tool 的描述与 inputSchema 构造工具定义，其中 schema 会先经 _normalize_mcp_input_schema() 规范化。","call(context, **kwargs) 委托 MCPClient.call_tool_with_reconnect()；发送给 MCP 服务的是保存在 mcp_tool.name 中的原始名称，超时取自 context.tool_call_timeout。"],"data":["mcp.Tool 是服务提供的工具描述；MCPTool 是 AstrBot 内部的 FunctionTool 子类；调用返回 MCP CallToolResult。"],"caveats":["提供给模型的名称可能与远端原始工具名不同；调用时不能把清洗后的名称当成远端名称。"],"sources":[["astrbot/core/agent/mcp_client.py",793,820]]}},{"id":"HandoffTool","label":"HandoffTool","kind":"class","group":"tools","x":1820,"y":1780,"summary":"FunctionTool 的特殊实现，把当前 Agent 请求交给另一个 Agent 或后台执行分支。","file":"astrbot/core/agent/handoff.py","fields":["agent","provider_id"],"methods":["default_parameters()","default_description()"],"sources":[["astrbot/core/agent/handoff.py",8,64]],"explanation":{"role":"代表向另一个 Agent 委派任务的特殊 FunctionTool；通过统一工具接口让主 Agent 能发出委派请求。","logic":["初始化时把工具命名为 transfer_to_\u003cagent.name>，保存目标 Agent，并根据需要提供参数与描述。","默认参数包括任务 input、可选 image_urls 和 background_task。","FunctionToolExecutor.execute() 识别 HandoffTool，根据 background_task 决定前台或后台的委派路径。"],"data":["agent 是 Agent 配置对象；provider_id 可作为子 Agent 的可选提供商覆盖；输入是模型提供的委派参数。"],"caveats":["该类本身主要描述委派工具及目标，子 Agent 的实际执行在 FunctionToolExecutor 的 handoff 分支。"],"sources":[["astrbot/core/agent/handoff.py",9,65],["astrbot/core/astr_agent_tool_exec.py",136,161]]}},{"id":"AgentResponse","label":"AgentResponse","kind":"record","group":"output","x":2170,"y":100,"summary":"Runner 对上层输出的中间协议；type 区分 llm_result、streaming_delta、tool_call、tool_call_result 等，data.chain 是 MessageChain。","file":"astrbot/core/agent/response.py","fields":["type：llm_result/streaming_delta/tool_call/tool_call_result/err 等类别","data.chain：响应承载的 MessageChain"],"methods":[],"sources":[["astrbot/core/agent/response.py",8,32]],"explanation":{"role":"Agent Runner 向上层报告一次运行进展的信封；调用者根据 type 区分普通模型结果、流式片段、工具调用和工具结果等，而不是直接把信封发给平台。","logic":["Runner 在执行期间逐个产出 AgentResponse；run_agent 遍历它们并按 type 选择记录、直接发送、暂存事件结果或者向调用方 yield。","data 中的 chain 是 MessageChain；同一包装可承载普通正文、工具状态等不同语义，不能只根据其类型判断是否是最终回答。"],"data":["type: str 标识响应类别；data 是 AgentResponseData，包含 chain: MessageChain。","工具直接输出可能通过 event.send 立即发送；普通结果通常作为事件结果进入后续处理。"],"caveats":["AgentResponse 是运行进度信封，不等同于 MessageEventResult，也不保证每个响应都代表完整回答。"],"sources":[["astrbot/core/agent/response.py",8,16],["astrbot/core/astr_agent_run_util.py",150,213],["astrbot/core/astr_agent_run_util.py",246,297]]}},{"id":"AgentStats","label":"AgentStats","kind":"record","group":"output","x":2170,"y":280,"summary":"聚合 token、上下文长度、首 token 时间和总耗时。","file":"astrbot/core/agent/response.py","fields":["token_usage：聚合 TokenUsage","current_context_tokens：最近请求输入 token","start_time/end_time/time_to_first_token：耗时统计"],"methods":["duration：计算运行时长","to_dict()：序列化统计"],"sources":[["astrbot/core/agent/response.py",19,32]],"explanation":{"role":"记录一次 Agent 运行的 token 用量、最近一次请求上下文 token 和时间信息，供运行统计与输出使用。","logic":["默认构造独立 TokenUsage 对象；duration 属性通过 end_time 减 start_time 计算。","to_dict 把 token_usage 转为字典副本，并附上上下文长度与各时间值。"],"data":["token_usage 表示用量统计；current_context_tokens 是最近一次请求输入 token，并非整个运行累计 token。","start_time、end_time 和 time_to_first_token 是记录值；to_dict 不包含单独计算的 duration 字段。"],"caveats":["duration 是属性，不是等待运行完成的方法；开始或结束时间未设置时数值本身不代表完整耗时。"],"sources":[["astrbot/core/agent/response.py",19,39]]}},{"id":"ContentPart","label":"ContentPart","kind":"abstract","group":"output","x":2170,"y":460,"summary":"Provider/Agent 消息内容片段基类；TextPart、ThinkPart、ImageURLPart、AudioURLPart 等由注册表反序列化。","file":"astrbot/core/agent/message.py","fields":["type","_no_save"],"methods":["model_dump_for_context()","mark_as_temp()"],"sources":[["astrbot/core/agent/message.py",19,80]],"explanation":{"role":"Agent 上下文消息内部的内容片段基类，统一文本、推理、图片和音频等多种片段的校验与序列化。","logic":["子类声明带默认值的 type 字段时登记到注册表；基类的 Pydantic 校验根据传入字典的 type 分发到具体片段类。","mark_as_temp 为片段设置 _no_save；model_dump_for_context 可把该标记加入字典，供上下文后续处理。"],"data":["Message.content 可包含 ContentPart 列表，每个片段的具体字段由其子类定义。"],"caveats":["ContentPart 用于模型上下文，不是消息平台输出使用的 BaseMessageComponent；二者虽然都表示片段，服务的边界不同。","临时标志由后续序列化/保存逻辑解释，不应推断所有 model_dump 调用都会自动删除临时片段。"],"sources":[["astrbot/core/agent/message.py",19,80],["astrbot/core/agent/message.py",195,215],["astrbot/core/agent/message.py",345,359]]}},{"id":"Message","label":"Message","kind":"record","group":"output","x":2170,"y":640,"summary":"kosong 风格的统一上下文消息：role、content、tool_calls、tool_call_id。","file":"astrbot/core/agent/message.py","fields":["role","content","tool_calls","tool_call_id"],"methods":["model_dump()"],"sources":[["astrbot/core/agent/message.py",195,249]],"explanation":{"role":"Agent 上下文中的单条消息模型，统一用户、助手、工具和系统消息，并保留工具调用及其回复之间的关联。","logic":["role 指定消息角色；content 可为字符串、ContentPart 列表、CheckpointData 或 None。","模型校验按角色检查内容；序列化方法整理模型输出，供上下文和持久化链处理。"],"data":["tool_calls 是助手发出的工具调用列表；tool_call_id 关联工具回复。不同角色可具有不同字段组合。"],"caveats":["它是模型对话上下文中的一条记录，不是外部平台收到的一条原始事件，也不是 MessageChain。"],"sources":[["astr
